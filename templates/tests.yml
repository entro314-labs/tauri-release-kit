# Thin caller for the shared quality gates. Runs on branch pushes so a release
# tag never discovers gate failures (macOS-local checks cannot see
# Linux/Windows diagnostics in cfg-gated code).
name: Checks

on:
  push:
    branches: [main, alpha, beta, dev]
  pull_request:
    branches: [main, alpha, beta, dev]

concurrency:
  group: rust-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: entro314-labs/tauri-release-kit/.github/workflows/rust-checks.yml@main
    with:
      project_path: 'apps/desktop'   # ← '.' for single-app repos
      run_tests: true
      # --- Run the macOS leg on your own mac instead of the 10×-billed
      #     hosted image (single self-hosted runner label). PRIVATE repos
      #     only: this workflow runs on pull_request, and a self-hosted
      #     runner on a public repo executes fork-PR code on your machine.
      # macos_runner: 'macbook'
      # --- cargo audit (on by default; fails on any RustSec vulnerability in
      #     Cargo.lock). Ignore an advisory only with the reason next to it.
      # cargo_audit: false
      # audit_ignore: 'RUSTSEC-2024-0370'   # ← why this one is accepted

  # Guards the changelog the release body and every update manifest are built from.
  # Skips itself on pushes: only a pull request carries a title to check.
  commits:
    uses: entro314-labs/tauri-release-kit/.github/workflows/commit-lint.yml@main
    with:
      lint_branch_commits: false   # ← true if you merge without squashing
