# Thin caller for the kit's credential preflight. Copy to
# .github/workflows/credentials.yml in your app repo and run it from the
# Actions tab before tagging a release — it proves every configured signing
# and publishing secret still works (decrypts, imports, authenticates, can
# push) in a few minutes, without building anything. Unconfigured optional
# channels are notices; broken or half-configured ones fail.
#
# Keep the `with:` values in step with your release.yml caller.
name: Credentials

on:
  workflow_dispatch:
  # Optional: catch an expiring certificate or token before release day.
  # schedule:
  #   - cron: '17 6 * * 1'   # Mondays 06:17 UTC

jobs:
  credentials:
    uses: entro314-labs/tauri-release-kit/.github/workflows/credentials.yml@main
    permissions:
      contents: read
    with:
      project_path: 'apps/desktop'     # ← as in release.yml
      releases_repo: 'my-org/myapp-releases'
      homebrew_tap: 'my-org/homebrew-tap'
      # environment: 'release'         # ← if release.yml reads its secrets from one
      # windows_azure_endpoint: 'https://wus2.codesigning.azure.net'
      # windows_azure_account: 'MyAccount'
      # windows_azure_cert_profile: 'MyProfile'
      # macos_runner: 'macbook'        # ← only runs when Apple secrets are set
    secrets: inherit
