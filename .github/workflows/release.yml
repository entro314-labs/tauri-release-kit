# Reusable Tauri release workflow: 6-platform build matrix, minisign-signed
# auto-updater artifacts, per-channel rolling update manifests, changelog guard,
# distribution code signing on all three OSes, release verification, optional
# Homebrew cask publishing, and a post-release version-bump PR.
#
# Extracted from a production app's release pipeline after its first
# releases shipped end-to-end; every non-obvious step below encodes a
# failure that actually happened. See README.md for the consumer checklist and
# docs/GOTCHAS.md for the war stories.
#
# Conventions this workflow assumes about the calling repo:
#   - pnpm + a `pnpm run build` invoked by tauri.conf.json's beforeBuildCommand
#   - Tauri project at <project_path>/src-tauri with per-OS overlay configs
#     src-tauri/tauri.{macos,windows,linux}.conf.json
#   - rust-toolchain.toml at the repo root pinning the toolchain AND declaring
#     components = ["rustfmt", "clippy"] (without this, rustup auto-installs
#     the pinned toolchain with the runner's minimal profile and the fmt /
#     clippy gates fail on every platform)
#   - CHANGELOG.md with a `## [X.Y.Z...]` heading per released tag
#   - bundle.createUpdaterArtifacts: true and the updater pubkey in
#     tauri.conf.json; the updater polls (on the RELEASES repo when
#     releases_repo is set):
#       stable      → releases/latest/download/latest.json
#       alpha/beta  → releases/download/latest-<channel>/latest.json
#   - Windows ships NSIS by default (WiX/MSI hard-rejects non-numeric semver
#     pre-release identifiers like `-alpha.1`, and WiX cannot target ARM64;
#     `windows_bundles: 'nsis,msi'` opts into MSI and the pipeline drops it
#     on the legs/versions where it cannot work rather than failing)
#
# DISTRIBUTION SIGNING is optional on every OS and degrades gracefully: with no
# secrets the pipeline ships unsigned artifacts and says so; with a credential
# set it signs AND verifies, failing loudly rather than shipping something the
# OS will reject.
#   - macOS: APPLE_* → codesign + notarize + staple, verified with
#     codesign/spctl/stapler
#   - Windows: signCommand (any issuer CLI) | Azure Artifact Signing | a PFX in
#     the runner cert store, verified with Get-AuthenticodeSignature
#   - Linux: one GPG key signs the AppImage (SIGN/APPIMAGETOOL_*) and the RPM
#     (TAURI_SIGNING_RPM_KEY), verified with --appimage-signature / rpm -K
#
# PRIVATE app repos MUST set `releases_repo` to a PUBLIC repo + provide
# RELEASES_TOKEN: private-repo release assets 404 for unauthenticated users,
# which silently breaks both downloads and the auto-updater.
#
# RESUMABLE: a run for a tag that already has a DRAFT release reuses that
# draft, so a partially failed release is retried via workflow_dispatch with
# `build_targets` set to just the failed legs — assets from successful legs
# are kept, and only the failed legs' runner minutes are spent again (macOS
# legs bill 10× on private repos; `build_targets` and the macos_*_runner
# self-hosted overrides are the kit's main cost levers). The `targets` input
# independently lets an app ship fewer than six platforms.

name: Release (reusable)

on:
  workflow_call:
    inputs:
      app_display_name:
        description: 'Human name used in release titles, e.g. "MyApp"'
        required: true
        type: string
      project_path:
        description: 'Path to the Tauri app package (contains src-tauri/), e.g. apps/desktop or .'
        required: false
        type: string
        default: '.'
      cargo_package:
        description: 'The [[package]] name in Cargo.lock to bump post-release'
        required: true
        type: string
      tag:
        description: 'Tag to release (vX.Y.Z[-suffix]); defaults to the pushed tag ref'
        required: false
        type: string
        default: ''
      node_version:
        description: 'Node.js version for the frontend build'
        required: false
        type: string
        default: '24'
      macos_arm_runner:
        description: >-
          Runner for the darwin-aarch64 leg. Default: the GitHub-hosted
          macos-15 image, which bills 10× on private repos. Set a SINGLE
          self-hosted runner label (e.g. 'macbook') to build this leg on your
          own Apple Silicon machine for free — read the README's
          "Self-hosted macOS legs" section first (keychain signing mode,
          offline-runner behaviour, and NEVER on a public repo whose
          workflows run for fork PRs).
        required: false
        type: string
        default: 'macos-15'
      macos_intel_runner:
        description: >-
          Runner for the darwin-x86_64 leg. Default: the GitHub-hosted
          macos-15-intel image. May point at the SAME Apple Silicon label as
          macos_arm_runner: the leg already builds --target
          x86_64-apple-darwin, and preflight compiles that target natively on
          arm64 macs — but the full bundle+notarize path is less proven
          cross-arch, so smoke-test with a cheap
          `build_targets: darwin-x86_64` dispatch before a real tag.
        required: false
        type: string
        default: 'macos-15-intel'
      linux_x64_runner:
        description: >-
          Runner for the linux-x86_64 leg. The binary requires the glibc of the
          image it was built on (docs/PACKAGING.md, "The glibc rule"):
          'ubuntu-24.04' (default) means glibc 2.39, 'ubuntu-22.04' 2.35 -
          choose the oldest image that still has WebKitGTK 4.1 to reach older
          distributions.
        required: false
        type: string
        default: 'ubuntu-24.04'
      linux_arm_runner:
        description: >-
          Runner for the linux-aarch64 leg; see linux_x64_runner
          ('ubuntu-24.04-arm' default, 'ubuntu-22.04-arm' for glibc 2.35).
        required: false
        type: string
        default: 'ubuntu-24.04-arm'
      cosign_sign:
        description: >-
          Sign SHA256SUMS and every AppImage with keyless Sigstore (cosign)
          and ship each bundle as <file>.sigstore.json, verifiable with
          `cosign verify-blob --bundle <file>.sigstore.json <file>` against
          this workflow's identity (docs/SIGNING.md). Works from a private
          repository - unlike actions/attest there - but the signing
          certificate is logged in the public Rekor transparency log and
          names the calling repository and workflow: turn it on only if that
          name may be public.
        required: false
        type: boolean
        default: false
      glibc_max:
        description: >-
          Highest glibc version (e.g. '2.35') the Linux binaries may require.
          Every Linux leg reports the glibc its binaries need in the run
          summary; with this set, a leg that needs more fails, so the release
          is never published. Empty = report only.
        required: false
        type: string
        default: ''
      releases_repo:
        description: >-
          'owner/name' of the repo that hosts the GitHub releases (and the
          rolling latest-<channel> updater manifests). Empty = this repo.
          REQUIRED (with the RELEASES_TOKEN secret) when the app repo is
          private — private release assets 404 anonymously, breaking downloads
          and auto-update.
        required: false
        type: string
        default: ''
      product_name:
        description: >-
          tauri.conf.json productName — the filename stem of bundled assets
          (<product>_<version>_aarch64.dmg) and the .app bundle name. Required
          for Homebrew cask and Scoop publishing; unused otherwise.
        required: false
        type: string
        default: ''
      homebrew_tap:
        description: >-
          'owner/name' of a Homebrew tap repo to publish a macOS cask to
          (stable → "<cask token>", prerelease → "<cask token>@<channel>").
          Empty = skip cask publishing. Requires product_name + the
          HOMEBREW_TAP_TOKEN secret (skips with a warning when absent).
        required: false
        type: string
        default: ''
      cask_desc:
        description: 'One-line description for the Homebrew cask'
        required: false
        type: string
        default: ''
      cask_homepage:
        description: 'Homepage URL for the Homebrew cask'
        required: false
        type: string
        default: ''
      bundle_identifier:
        description: >-
          tauri.conf.json identifier (e.g. com.example.app). When set, the cask
          gets a `zap trash:` block for the standard ~/Library paths.
        required: false
        type: string
        default: ''
      rust_workspace_dir:
        description: >-
          Directory containing the cargo workspace root (Cargo.lock + target/).
          Defaults to '<project_path>/src-tauri' (src-tauri is its own
          workspace). Set to '.' for repo-root workspaces where src-tauri is a
          member — the post-release bump also falls back to the repo-root
          Cargo.lock automatically.
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated platform set the app SHIPS, as updater-manifest keys
          (subset of: darwin-aarch64, darwin-x86_64, windows-x86_64,
          windows-aarch64, linux-x86_64, linux-aarch64). Drives the build
          matrix, the updater manifest, release verification, and the cask
          arch blocks — an app only pays for the legs it ships. Default: all
          six.
        required: false
        type: string
        default: 'darwin-aarch64,darwin-x86_64,windows-x86_64,windows-aarch64,linux-x86_64,linux-aarch64'
      macos_bundles:
        description: >-
          Comma-separated macOS bundle formats (subset of: app, dmg). `app` is
          REQUIRED while any darwin target ships — the updater consumes the
          .app.tar.gz that only the `app` bundle produces. `dmg` is the
          user-facing installer (and what the Homebrew cask points at).
        required: false
        type: string
        default: 'app,dmg'
      windows_bundles:
        description: >-
          Comma-separated Windows bundle formats (subset of: nsis, msi).
          `nsis` is REQUIRED while any windows target ships — the updater
          consumes the *-setup.exe. `msi` is DROPPED with a warning (not an
          error) on the legs and versions where WiX cannot work: prerelease
          versions (WiX rejects non-numeric semver identifiers like
          `-alpha.1`) and the aarch64 leg (WiX cannot target ARM64).
        required: false
        type: string
        default: 'nsis'
      linux_bundles:
        description: >-
          Comma-separated Linux bundle formats (subset of: deb, rpm,
          appimage). `appimage` is REQUIRED while any linux target ships — the
          updater consumes the .AppImage. deb/rpm are the distro packages the
          Flatpak and AUR pipelines consume downstream.
        required: false
        type: string
        default: 'deb,rpm,appimage'
      windows_sign_command:
        description: >-
          Escape hatch for Windows signing: a verbatim
          `bundle > windows > signCommand` (MUST contain the `%1` placeholder).
          Takes precedence over every auto-detected mode below — use it for
          SSL.com eSigner, an HSM/YubiKey tool, `relic` against Azure Key
          Vault, or any issuer-specific CLI. The tool must already be on the
          runner PATH (install it in the caller before this workflow, or use a
          command that bootstraps itself).
        required: false
        type: string
        default: ''
      windows_azure_endpoint:
        description: >-
          Azure Artifact Signing (ex Azure Trusted Signing) endpoint, e.g.
          https://wus2.codesigning.azure.net. Set together with
          windows_azure_account + windows_azure_cert_profile and the
          AZURE_CLIENT_ID/AZURE_CLIENT_SECRET/AZURE_TENANT_ID secrets to sign
          via artifact-signing-cli.
        required: false
        type: string
        default: ''
      windows_azure_account:
        description: 'Azure Artifact Signing account name (-a)'
        required: false
        type: string
        default: ''
      windows_azure_cert_profile:
        description: 'Azure Artifact Signing certificate profile name (-c)'
        required: false
        type: string
        default: ''
      windows_timestamp_url:
        description: >-
          RFC3161 timestamp server for the PFX/thumbprint signing mode. A
          timestamped signature stays valid after the certificate expires;
          an untimestamped one does not.
        required: false
        type: string
        default: 'http://timestamp.digicert.com'
      windows_digest_algorithm:
        description: 'Digest algorithm for the PFX/thumbprint signing mode'
        required: false
        type: string
        default: 'sha256'
      build_targets:
        description: >-
          Comma-separated subset of `targets` to BUILD in this run. Empty =
          all of `targets`. This is the retry lever for a partially failed
          release: re-dispatch with the SAME tag and only the failed legs —
          the run reuses the existing draft (successful legs' assets are
          already on it) and the updater manifest still covers the full
          `targets` set. A failed leg then costs one leg's minutes, not six.
        required: false
        type: string
        default: ''
      post_release_bump:
        description: >-
          Open a post-release PR bumping the app repo to the next patch
          version (stable releases only). Set false when a local release
          driver (e.g. release-kit) writes the version BEFORE tagging —
          otherwise two writers race on the same version files every release.
          Opening the PR needs the app repo's "Allow GitHub Actions to create
          and approve pull requests" setting; without it the branch is pushed
          and the job fails.
        required: false
        type: boolean
        default: true
      macos_linkage_check:
        description: >-
          Fail a darwin leg when any Mach-O file in the built .app (main
          binary, sidecars, bundled dylibs/frameworks) loads a library from
          /opt/homebrew/ or /usr/local/{opt,Cellar,lib}/ — a path that exists
          on the build runner and crashes the app at launch on machines
          without that Homebrew formula. On by default; turn off only if the
          app is deliberately distributed with that dependency guaranteed
          (e.g. solely through a Homebrew cask that `depends_on` the formula).
        required: false
        type: boolean
        default: true
      smoke_test:
        description: >-
          Install and launch the built packages on every leg whose runner can
          execute them (opt-in): deb version, AppImage started under Xvfb,
          MSI ProductVersion, NSIS silent install + launch, dmg verify + .app
          launch. Cross-arch legs (an x86_64 leg on an arm64 runner) are
          skipped with a notice. Adds a few minutes per leg; see the README.
        required: false
        type: boolean
        default: false
      webdriver_smoke:
        description: >-
          A command that checks the built app's UI through WebDriver on the
          native Linux legs (e.g. 'node tooling/scripts/boot-smoke.ts'). It is
          run from the repository root under Xvfb with tauri-driver listening
          on 127.0.0.1:4444 and a fresh profile, and gets the app binary's
          path as its last argument; a non-zero exit fails the leg before
          anything is published. Empty (the default) skips it. Needs
          webdriver_binary.
        required: false
        type: string
        default: ''
      webdriver_binary:
        description: >-
          File name of the app binary in target/<triple>/release that
          webdriver_smoke drives (the main binary, not a sidecar).
        required: false
        type: string
        default: ''
      winget_identifier:
        description: >-
          winget PackageIdentifier (e.g. 'MyOrg.MyApp') to submit each STABLE
          release to microsoft/winget-pkgs with. Empty = no winget. Needs the
          WINGET_TOKEN secret and a one-time manual first submission (README,
          "winget and Scoop").
        required: false
        type: string
        default: ''
      winget_fork_user:
        description: >-
          Owner of the winget-pkgs fork WINGET_TOKEN pushes the manifest branch
          to. Empty = this repo's owner (winget-releaser's default).
        required: false
        type: string
        default: ''
      scoop_bucket:
        description: >-
          'owner/name' of a Scoop bucket repo whose bucket/<product_name
          lowercased>.json is updated (version, url, hash) on each STABLE
          release. Empty = no Scoop. Needs product_name, the manifest created
          once by hand, and SCOOP_TAP_TOKEN or the GitHub App.
        required: false
        type: string
        default: ''
      app_client_id:
        description: >-
          Client ID of a GitHub App used INSTEAD of the RELEASES_TOKEN /
          HOMEBREW_TAP_TOKEN / SCOOP_TAP_TOKEN PATs for every cross-repo write
          (releases_repo, homebrew_tap, scoop_bucket). Needs the APP_PRIVATE_KEY secret, and the App
          installed on each of those repos with Contents: Read and write. Each
          job mints its own token scoped to exactly the repo it writes. Empty
          = the PATs, as before. See the README, "GitHub App instead of PATs".
        required: false
        type: string
        default: ''
      environment:
        description: >-
          Optional GitHub environment (in the CALLING repo) for every job that
          reads a signing or publishing secret, so those secrets can live in
          that environment behind its protection rules instead of at repo
          level. Empty = no environment, exactly as before. See the README's
          "Scoping secrets to an environment".
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: 'minisign private key for updater artifact signatures (REQUIRED — createUpdaterArtifacts fails without it)'
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: 'Password for the updater key; omit for passwordless keys'
        required: false
      RELEASES_TOKEN:
        description: >-
          Fine-grained PAT with Contents:RW on releases_repo. Required when
          releases_repo is set (the default GITHUB_TOKEN cannot write
          cross-repo); ignored otherwise.
        required: false
      HOMEBREW_TAP_TOKEN:
        description: 'Fine-grained PAT with Contents:RW on homebrew_tap. Cask publishing skips with a warning when absent.'
        required: false
      APP_PRIVATE_KEY:
        description: 'Private key (.pem contents) of the GitHub App named by app_client_id. Replaces RELEASES_TOKEN, HOMEBREW_TAP_TOKEN and SCOOP_TAP_TOKEN when set.'
        required: false
      WINGET_TOKEN:
        description: 'Classic PAT (public_repo) of the account owning the winget-pkgs fork. winget submission skips with a warning when absent.'
        required: false
      SCOOP_TAP_TOKEN:
        description: 'Fine-grained PAT with Contents:RW on scoop_bucket (same name as go-release-kit). Not needed with the GitHub App.'
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      # --- Windows distribution signing (all optional; unset = unsigned) ---
      WINDOWS_CERTIFICATE:
        description: 'base64 of a code-signing .pfx. Imported into the runner cert store; its thumbprint is read back and injected into the bundle config.'
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        description: 'Export password of WINDOWS_CERTIFICATE'
        required: false
      WINDOWS_CERTIFICATE_THUMBPRINT:
        description: >-
          SHA-1 thumbprint to sign with. Optional even in PFX mode (it is read
          back from the import); REQUIRED on its own when the certificate is
          already present on a self-hosted runner or lives on an HSM/token.
        required: false
      AZURE_CLIENT_ID:
        description: 'Azure Artifact Signing service principal (app registration) client id'
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      # --- Linux artifact signing (optional; one GPG key signs AppImage + RPM) ---
      LINUX_GPG_PRIVATE_KEY:
        description: >-
          ASCII-armored private key (or its base64) used to sign the AppImage
          (gpg, via appimagetool) and the RPM (tauri-bundler). Unset = unsigned
          Linux artifacts, which is a valid choice — Linux does not gate
          execution on signatures.
        required: false
      LINUX_GPG_PASSPHRASE:
        description: 'Passphrase for LINUX_GPG_PRIVATE_KEY. REQUIRED in CI when the key has one — gpg would otherwise block on a TTY prompt that never comes.'
        required: false
      LINUX_GPG_KEY_ID:
        description: 'Key ID/fingerprint to sign with. Defaults to the first secret key in the imported keyring.'
        required: false
      SENTRY_DSN:
        description: 'Optional: baked into release builds as SENTRY_DSN + VITE_SENTRY_DSN (non-empty only)'
        required: false
      SENTRY_AUTH_TOKEN:
        description: 'Optional: exported to the build for sourcemap/symbol upload tooling (non-empty only)'
        required: false
    outputs:
      published:
        description: >-
          'true' once the release is public. A job after the publish (Homebrew,
          winget, Scoop, bump-version) can still fail the call; gate follow-on
          channels on this, not on the call's result.
        value: ${{ jobs.publish-release.outputs.published }}

# Each job declares what it needs; in a workflow_call the caller's grant is the ceiling.
permissions:
  contents: read

jobs:
  # Fail fast: no CHANGELOG entry for the tag (or a missing cross-repo token)
  # → no matrix spin-up. macOS runners bill 10× on private repos; every gate
  # that can run on ubuntu first, does.
  check-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `environment` on every job that reads a signing/publishing secret (this
    # one checks RELEASES_TOKEN): a job WITHOUT it would resolve secrets.X to
    # the repo-level value, so an environment-scoped secret would look unset
    # there. An empty name means no environment — not documented by GitHub,
    # but GitHub Desktop's CI relies on it on every pull request (its
    # `environment: ${{ inputs.environment }}` jobs run with no deployment).
    # rust-fmt, plan and bump-version read no such secret and stay outside.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read   # checkout only
    outputs:
      version: ${{ steps.resolved.outputs.VERSION }}
      # The commit the tag points to, resolved once: every later checkout builds exactly this
      # commit, so a tag moved (or force-pushed) while the release runs can't mix two commits'
      # assets in one release.
      sha: ${{ steps.resolved.outputs.SHA }}
      # 'owner name' pair resolved once; jobs re-split it (expressions have no split()).
      releases_owner: ${{ steps.relrepo.outputs.OWNER }}
      releases_name: ${{ steps.relrepo.outputs.NAME }}
    env:
      INPUT_TAG: ${{ inputs.tag }}
      RELEASES_REPO: ${{ inputs.releases_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A dispatch retry names the tag; without this it would build whatever the
          # default branch is at retry time and attach that beside the tag's assets.
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: resolved
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Only the two prerelease channels the pipeline has exist: any other suffix
          # (-rc.1, -next) would fall through the channel switch below to "stable" and
          # be published as the latest release every stable client updates to.
          if ! printf '%s' "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$'; then
            echo "::error::Version '$VERSION' is not a valid release tag (expected vX.Y.Z, vX.Y.Z-alpha.N or vX.Y.Z-beta.N — alpha and beta are the only channels)"
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "BARE=${VERSION#v}"
            echo "SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve releases repo
        id: relrepo
        run: |
          REPO="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          echo "OWNER=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "NAME=${REPO##*/}" >> "$GITHUB_OUTPUT"

      # Cross-repo mode is all-or-nothing: catching a missing token here costs
      # seconds; catching it at publish costs a full 6-platform build.
      - name: Preflight - cross-repo credential present
        if: inputs.releases_repo != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_CLIENT_ID}" ]; then
            if [ -z "${APP_PRIVATE_KEY:-}" ]; then
              echo "::error::app_client_id is set but the APP_PRIVATE_KEY secret is missing — add the GitHub App's private key"
              exit 1
            fi
            echo "GitHub App ${APP_CLIENT_ID} configured for ${RELEASES_REPO}."
            exit 0
          fi
          if [ -z "${RELEASES_TOKEN:-}" ]; then
            echo "::error::releases_repo is set but neither the RELEASES_TOKEN secret nor app_client_id is — create a fine-grained PAT with Contents:RW on ${RELEASES_REPO}, or configure a GitHub App (README)"
            exit 1
          fi
          echo "RELEASES_TOKEN present."

      # With a GitHub App, minting here proves it is installed on the releases
      # repo with Contents: write — before any leg runs.
      - name: Preflight - GitHub App can write the releases repo
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.relrepo.outputs.OWNER }}
          repositories: ${{ steps.relrepo.outputs.NAME }}
          permission-contents: write

      - name: Verify CHANGELOG entry exists
        env:
          VERSION: ${{ steps.resolved.outputs.VERSION }}
          BARE: ${{ steps.resolved.outputs.BARE }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not present — its ${VERSION} section is the release body and the updater notes. Add one before tagging."
            exit 1
          fi
          # The same heading shape the release-body extractor in create-release reads
          # (`## [X.Y.Z]`): a looser guard passed headings the extractor cannot find,
          # and the release then shipped with a placeholder body.
          if ! grep -E "^## \[(${VERSION}|${BARE})\]" CHANGELOG.md >/dev/null; then
            echo "::error::CHANGELOG.md has no '## [${BARE}]' heading. Add one before tagging."
            exit 1
          fi
          echo "Found CHANGELOG entry for ${VERSION}."

      # The updater manifest's version comes from the tag alone. An app whose config
      # says a different number ships a manifest that is newer than itself and offers
      # every installed copy an "update" to what it already runs, forever — and
      # verify-release cannot see it. Tauri lets tauri.conf.json omit `version` and
      # inherit the crate's, so that is the fallback.
      - name: Verify the tag matches the app's version
        env:
          BARE: ${{ steps.resolved.outputs.BARE }}
          SRC_TAURI: ${{ inputs.project_path }}/src-tauri
        run: |
          set -euo pipefail
          CONF="${SRC_TAURI}/tauri.conf.json"
          if [ ! -f "$CONF" ]; then
            echo "::error::${CONF} not found — check the project_path input"
            exit 1
          fi
          APP_VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("version") or "")' "$CONF")
          SOURCE="$CONF"
          if [ -z "$APP_VERSION" ]; then
            SOURCE="${SRC_TAURI}/Cargo.toml"
            APP_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' "$SOURCE" | head -1)
          fi
          if [ "$APP_VERSION" != "$BARE" ]; then
            echo "::error::Tag ${BARE} does not match ${SOURCE}, which says '${APP_VERSION}'. Bump the config before tagging (release-kit's versionFiles keeps them in step)."
            exit 1
          fi
          echo "${SOURCE} agrees with the tag (${BARE})."

  # Formatting is target-independent, so one cheap ubuntu runner settles it for
  # all six legs before the matrix spins up (a real release burned six
  # runners on an import-order diff that each leg's own fmt step then caught).
  # Runs in parallel with check-changelog; needs no system deps or node_modules
  # — rustup still honors the repo's pinned rust-toolchain.toml.
  rust-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A dispatch retry names the tag; without this it would build whatever the
          # default branch is at retry time and attach that beside the tag's assets.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Rust format check
        working-directory: ${{ inputs.project_path }}/src-tauri
        run: cargo fmt --all -- --check

  # Resolve which legs the app ships (`targets`) and which THIS run builds
  # (`build_targets`). Splitting the two is what makes a failed release
  # resumable: a retry dispatch rebuilds only the failed legs against the same
  # draft release, while the manifest + verification still cover every shipped
  # platform. Seconds on ubuntu; saves rebuilding 10×-billed macOS legs that
  # already succeeded.
  plan:
    needs: check-changelog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Computes the matrix from inputs; touches no API.
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.MATRIX }}
      targets: ${{ steps.plan.outputs.TARGETS }}
      macos_bundles: ${{ steps.plan.outputs.MACOS_BUNDLES }}
      # The x86_64 leg's list; the aarch64 leg is the same minus msi.
      windows_bundles: ${{ steps.plan.outputs.WINDOWS_BUNDLES }}
      linux_bundles: ${{ steps.plan.outputs.LINUX_BUNDLES }}
    env:
      TARGETS: ${{ inputs.targets }}
      BUILD_TARGETS: ${{ inputs.build_targets }}
      MACOS_BUNDLES: ${{ inputs.macos_bundles }}
      WINDOWS_BUNDLES: ${{ inputs.windows_bundles }}
      LINUX_BUNDLES: ${{ inputs.linux_bundles }}
      MACOS_ARM_RUNNER: ${{ inputs.macos_arm_runner }}
      MACOS_INTEL_RUNNER: ${{ inputs.macos_intel_runner }}
      LINUX_X64_RUNNER: ${{ inputs.linux_x64_runner }}
      LINUX_ARM_RUNNER: ${{ inputs.linux_arm_runner }}
      VERSION: ${{ needs.check-changelog.outputs.version }}
    steps:
      - name: Compute build matrix
        id: plan
        run: |
          set -euo pipefail
          # One leg definition per updater-manifest platform key.
          #   - macOS: native runner per arch — cross-compiling trips
          #     rustls/ring on apple-sys crates.
          #   - Windows: pinned to windows-2022 while WebView2 + Tauri
          #     behaviour on the windows-2025 images stabilises. The updater
          #     matchers consume the NSIS *-setup.exe artifacts on both
          #     arches; MSI, when requested, is an extra installer for
          #     stable x86_64 only (see the degradation rules below).
          #   - `config` (relative to project_path) applies the per-OS bundle
          #     overlay; without --config those overrides are DROPPED.
          LEGS='{
            "darwin-aarch64":  {"platform":"macos-15","target":"aarch64-apple-darwin","os_name":"darwin","arch":"aarch64","config":"src-tauri/tauri.macos.conf.json"},
            "darwin-x86_64":   {"platform":"macos-15-intel","target":"x86_64-apple-darwin","os_name":"darwin","arch":"x86_64","config":"src-tauri/tauri.macos.conf.json"},
            "windows-x86_64":  {"platform":"windows-2022","target":"x86_64-pc-windows-msvc","os_name":"windows","arch":"x86_64","config":"src-tauri/tauri.windows.conf.json"},
            "windows-aarch64": {"platform":"windows-11-arm","target":"aarch64-pc-windows-msvc","os_name":"windows","arch":"aarch64","config":"src-tauri/tauri.windows.conf.json"},
            "linux-x86_64":    {"platform":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","os_name":"linux","arch":"x86_64","config":"src-tauri/tauri.linux.conf.json"},
            "linux-aarch64":   {"platform":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","os_name":"linux","arch":"aarch64","config":"src-tauri/tauri.linux.conf.json"}
          }'
          # The darwin platforms honor the macos_*_runner inputs so the
          # 10×-billed macOS minutes can move to a self-hosted mac. The other
          # legs stay GitHub-hosted: Linux/Windows minutes are cheap, and
          # windows-11-arm has no self-hosted equivalent anyway.
          LEGS=$(printf '%s' "$LEGS" | jq -c \
            --arg arm "$MACOS_ARM_RUNNER" --arg intel "$MACOS_INTEL_RUNNER" \
            --arg lx "$LINUX_X64_RUNNER" --arg la "$LINUX_ARM_RUNNER" '
            .["darwin-aarch64"].platform = $arm |
            .["darwin-x86_64"].platform  = $intel |
            .["linux-x86_64"].platform   = $lx |
            .["linux-aarch64"].platform  = $la')
          norm() { printf '%s' "$1" | tr -d '[:space:]' | tr ',' '\n' | sed '/^$/d' | awk '!seen[$0]++'; }
          TARGET_LIST=$(norm "$TARGETS")
          [ -n "$TARGET_LIST" ] || { echo "::error::targets input resolved to an empty set"; exit 1; }
          BUILD_LIST=$(norm "${BUILD_TARGETS:-}")
          [ -n "$BUILD_LIST" ] || BUILD_LIST="$TARGET_LIST"
          for t in $TARGET_LIST; do
            printf '%s' "$LEGS" | jq -e --arg t "$t" 'has($t)' >/dev/null \
              || { echo "::error::Unknown target '$t' in targets input"; exit 1; }
          done
          for t in $BUILD_LIST; do
            printf '%s\n' "$TARGET_LIST" | grep -qx -- "$t" \
              || { echo "::error::build_targets entry '$t' is not in this app's targets set"; exit 1; }
          done
          # --- Bundle formats per OS -------------------------------------
          # Validated against the formats tauri's CLI actually accepts, then
          # reduced per leg. A format the updater NEEDS is a hard error (a
          # missing one produces a manifest entry with a null url that
          # verify-release rejects after the whole matrix has already been
          # paid for); a format that merely CANNOT work on a given leg is
          # dropped with a warning, so one impossible combination never costs
          # an otherwise-shippable release.
          ships() { printf '%s\n' "$TARGET_LIST" | grep -q "^$1-"; }
          check_formats() {
            local os="$1" allowed="$2" required="$3" list="$4"
            for f in $list; do
              # $allowed is space-separated, so match on padded words.
              case " $allowed " in
                *" $f "*) ;;
                *) echo "::error::Unknown ${os} bundle format '$f' (allowed: ${allowed})"; exit 1 ;;
              esac
            done
            if ships "$os" && ! printf '%s\n' "$list" | grep -qx -- "$required"; then
              echo "::error::${os} targets are shipped but '${required}' is missing from the ${os}_bundles input — the updater manifest cannot be built without it"
              exit 1
            fi
          }
          MAC_LIST=$(norm "$MACOS_BUNDLES")
          WIN_LIST=$(norm "$WINDOWS_BUNDLES")
          LIN_LIST=$(norm "$LINUX_BUNDLES")
          check_formats darwin  "app dmg"          app      "$MAC_LIST"
          check_formats windows "nsis msi"         nsis     "$WIN_LIST"
          check_formats linux   "deb rpm appimage" appimage "$LIN_LIST"

          # MSI degradations — both are hard upstream limits, not policy:
          #   1. WiX rejects non-numeric semver pre-release identifiers, so
          #      `0.2.0-alpha.1` fails at bundle time on a leg that already
          #      compiled.
          #   2. WiX has no ARM64 target at all.
          WIN_X64_LIST="$WIN_LIST"
          WIN_ARM_LIST="$WIN_LIST"
          if printf '%s\n' "$WIN_LIST" | grep -qx msi; then
            if printf '%s' "${VERSION#v}" | grep -q -- '-'; then
              echo "::warning::Dropping the msi bundle for prerelease ${VERSION} — WiX rejects non-numeric semver pre-release identifiers. NSIS still ships on every Windows leg."
              WIN_X64_LIST=$(printf '%s\n' "$WIN_X64_LIST" | grep -vx msi || true)
            fi
            echo "::warning::Dropping the msi bundle on windows-aarch64 — WiX cannot target ARM64. NSIS still ships there."
            WIN_ARM_LIST=$(printf '%s\n' "$WIN_ARM_LIST" | grep -vx msi || true)
          fi

          csv() { printf '%s\n' "$1" | paste -sd, -; }
          MAC_CSV=$(csv "$MAC_LIST"); WIN_X64_CSV=$(csv "$WIN_X64_LIST")
          WIN_ARM_CSV=$(csv "$WIN_ARM_LIST"); LIN_CSV=$(csv "$LIN_LIST")

          LEGS=$(printf '%s' "$LEGS" | jq -c \
            --arg mac "$MAC_CSV" --arg win "$WIN_X64_CSV" --arg winarm "$WIN_ARM_CSV" --arg lin "$LIN_CSV" '
            with_entries(.value.bundles = (
              if   .value.os_name == "darwin"  then $mac
              elif .value.os_name == "windows" then (if .value.arch == "aarch64" then $winarm else $win end)
              else $lin end))')

          MATRIX=$(printf '%s\n' "$BUILD_LIST" | jq -cRn --argjson legs "$LEGS" '{include: [inputs | $legs[.]]}')
          {
            echo "MATRIX=$MATRIX"
            echo "TARGETS=$(csv "$TARGET_LIST")"
            echo "MACOS_BUNDLES=$MAC_CSV"
            echo "WINDOWS_BUNDLES=$WIN_X64_CSV"
            echo "LINUX_BUNDLES=$LIN_CSV"
          } >> "$GITHUB_OUTPUT"
          echo "Building: $(csv "$BUILD_LIST") (shipping set: $(csv "$TARGET_LIST"))"
          echo "Bundles — macOS: ${MAC_CSV:-none}  Windows: ${WIN_X64_CSV:-none} (arm64: ${WIN_ARM_CSV:-none})  Linux: ${LIN_CSV:-none}"

  create-release:
    needs: check-changelog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    # Creates (or reuses) the draft when releases_repo is empty.
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ needs.check-changelog.outputs.version }}
      channel: ${{ steps.get_channel.outputs.CHANNEL }}
    steps:
      - name: Determine channel
        id: get_channel
        env:
          VERSION: ${{ needs.check-changelog.outputs.version }}
        run: |
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "CHANNEL=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_OUTPUT"
          else
            echo "CHANNEL=stable" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tag's commit as check-changelog resolved it (a dispatch retry names the tag;
          # without a ref it would build whatever the default branch is at retry time).
          ref: ${{ needs.check-changelog.outputs.sha }}

      # The release body IS the tag's CHANGELOG section: it becomes the notes
      # users see on the release page AND — via create-updater-json's `notes`
      # field — the `update.body` the in-app updater shows BEFORE install.
      # A placeholder here means every consumer shows a useless changelog.
      - name: Extract changelog section for release body
        id: notes
        env:
          VERSION: ${{ needs.check-changelog.outputs.version }}
        run: |
          BARE="${VERSION#v}"
          BODY_FILE="$RUNNER_TEMP/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            # Section = lines after `## [X.Y.Z...]` up to the next `## [` heading.
            awk -v ver="$BARE" '
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]") > 0) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > "$BODY_FILE"
          fi
          if [ ! -s "${BODY_FILE:-/dev/null}" ]; then
            echo "No CHANGELOG section found for $BARE — using fallback body" >&2
            printf 'See the changelog in the repository for details on this release.\n' > "$BODY_FILE"
          fi
          echo "file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      # GitHub App token for releases_repo when app_client_id is set. Minted
      # in every job that writes there, scoped to that one repo: a token in a
      # job output is masked and dropped, so jobs cannot share one.
      - name: Mint releases-repo token (GitHub App)
        id: app_token
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repositories: ${{ needs.check-changelog.outputs.releases_name }}
          permission-contents: write

      # The draft is created on the releases repo (which may be a public
      # mirror — see the header note on private repos). On publish, GitHub
      # creates the tag on that repo's default branch.
      #
      # FIND-or-create: a retry dispatch for the same tag must land on the
      # SAME draft so assets from already-successful legs are kept (that is
      # what makes a failed release cost one leg instead of six). Drafts are
      # invisible to getReleaseByTag, so scan the release list. A PUBLISHED
      # release for the tag is a hard error — never silently overwrite what
      # users' updaters may already have seen.
      - name: Create or reuse draft release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.check-changelog.outputs.version }}
          CHANNEL: ${{ steps.get_channel.outputs.CHANNEL }}
          APP_NAME: ${{ inputs.app_display_name }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          REL_NAME: ${{ needs.check-changelog.outputs.releases_name }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        with:
          # Default GITHUB_TOKEN cannot write to another repo.
          github-token: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs');
            const { VERSION, CHANNEL, APP_NAME, REL_OWNER, REL_NAME, NOTES_FILE } = process.env;
            const body = readFileSync(NOTES_FILE, 'utf8').trim();
            const prerelease = CHANNEL !== 'stable';
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: REL_OWNER, repo: REL_NAME, per_page: 100,
            });
            // A draft whose tag was never created (or was deleted) shows up as `untagged-<hash>`;
            // re-tag that draft rather than open a duplicate beside it.
            const existing =
              releases.find((r) => r.tag_name === VERSION) ??
              releases.find(
                (r) =>
                  r.draft &&
                  r.tag_name.startsWith('untagged-') &&
                  r.name === `${APP_NAME} ${VERSION}`,
              );
            if (existing && !existing.draft) {
              core.setFailed(`A published release for ${VERSION} already exists on ${REL_OWNER}/${REL_NAME} — bump the version (or delete that release) instead of re-releasing the tag.`);
              return;
            }
            if (existing) {
              core.info(`Reusing draft release ${existing.id} for ${VERSION} (retry run) — refreshing title/notes.`);
              await github.rest.repos.updateRelease({
                owner: REL_OWNER, repo: REL_NAME, release_id: existing.id,
                tag_name: VERSION, name: `${APP_NAME} ${VERSION}`, body,
                draft: true, prerelease,
              });
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: REL_OWNER,
              repo: REL_NAME,
              tag_name: VERSION,
              name: `${APP_NAME} ${VERSION}`,
              body,
              draft: true,
              prerelease,
            })
            return data.id

  build-and-release:
    needs: [check-changelog, create-release, rust-fmt, plan]
    strategy:
      fail-fast: false
      # Leg definitions (and the war stories behind them) live in the plan
      # job — it filters them down to this run's build_targets.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 180
    environment: ${{ inputs.environment }}
    # tauri-action uploads assets to the draft in same-repo mode.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tag's commit as check-changelog resolved it (a dispatch retry names the tag;
          # without a ref it would build whatever the default branch is at retry time).
          ref: ${{ needs.check-changelog.outputs.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # No dependency cache, for the reason there is no Rust cache below: a
      # tag run can only restore what the default branch saved, and anything
      # able to write that key would feed the pnpm store — and so the
      # frontend bundled into the signed app — from outside this release.
      # `package-manager-cache: false` also stops setup-node's automatic
      # caching when package.json's packageManager names npm.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          package-manager-cache: false

      # The pinned toolchain from rust-toolchain.toml is what cargo actually
      # uses; the toml MUST declare components = ["rustfmt", "clippy"], because
      # rustup auto-installs it with this action's minimal profile.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # No Rust cache on release legs, deliberately. A tag run can restore only
      # caches saved on its own tag or on the default branch, so the entry a
      # previous tag's run saved was never reachable by the next release; the
      # only restorable entries came from default-branch runs (a
      # build_targets retry dispatched from main). So nearly every tag build was
      # already cold, and the cache's one real effect was a poisoning path:
      # anything able to write a matching key on the default branch would have
      # its target/ and ~/.cargo contents compiled into a signed release.

      # Plain apt-get, NOT awalsh128/cache-apt-pkgs-action: on a real release's
      # arm64 leg that action reported "Clean installing 12
      # packages... done" while actually installing ZERO packages, and the
      # build died at glib-sys/pkg-config ten minutes later. A release must
      # fail loudly at the install step; the caching saved ~40s.
      # libfuse2t64: linuxdeploy is itself an AppImage and needs FUSE2 to run;
      # the ubuntu-24.04 images (20260714+) no longer ship it. ubuntu-22.04
      # (linux_*_runner) names the same library libfuse2.
      # rpm: only needed to VERIFY the bundled .rpm's signature below —
      # tauri-bundler writes RPMs itself, no rpmbuild involved.
      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-0 \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-0 \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            "$(apt-cache show libfuse2t64 >/dev/null 2>&1 && echo libfuse2t64 || echo libfuse2)" \
            rpm

      # Bundling three Linux formats writes the payload three times on top of
      # a release target dir and node_modules. Stock runners have ~14 GB free,
      # and running out surfaces as an unrelated "failed to run linuxdeploy"
      # with a buried disk-space warning — so make room first, on
      # GitHub-hosted images only (self-hosted runners have no such bloat and
      # the paths simply won't exist).
      - name: Free runner disk space
        if: matrix.os_name == 'linux'
        run: |
          BEFORE=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          AFTER=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Free space: ${BEFORE}G -> ${AFTER}G"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        working-directory: ${{ inputs.project_path }}/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy check
        working-directory: ${{ inputs.project_path }}/src-tauri
        env:
          TARGET: ${{ matrix.target }}
        run: cargo clippy --target "$TARGET" -- -D warnings

      # Materialize the App Store Connect API key (.p8) for notarization.
      # Stored base64 so it survives the GitHub secrets UI. No-op when unset.
      - name: Materialize Apple API key
        id: apple_api_key
        if: matrix.os_name == 'darwin'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEY_PATH="${RUNNER_TEMP}/apple_api_key.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "path=${KEY_PATH}" >> "$GITHUB_OUTPUT"

      # CRITICAL: only export Apple env vars that are NON-EMPTY. GitHub renders
      # unset secrets as empty strings, and tauri-bundler's var_os() treats an
      # empty-but-set APPLE_CERTIFICATE as "signing configured" — it then runs
      # `security import` with an empty cert and fails the whole bundle step
      # (SecKeychainItemImport: parameters not valid).
      - name: Export Apple signing env (non-empty only)
        if: matrix.os_name == 'darwin'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ steps.apple_api_key.outputs.path }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Half-configured is a hard fail, as it is for Windows: a certificate with no
          # identity or no password makes tauri-bundler build unsigned, and the verify
          # step can only warn about what it cannot tell apart from "unconfigured".
          # Identity alone stays legal — that is the self-hosted keychain mode.
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            for required in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE_PASSWORD; do
              if [ -z "${!required:-}" ]; then
                echo "::error::APPLE_CERTIFICATE is set but ${required} is empty — Apple signing is half-configured; set both or neither"
                exit 1
              fi
            done
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=${!name}" >> "$GITHUB_ENV"
            fi
          done

      # Windows distribution signing. Four modes, first match wins; every one
      # is optional and an unmatched runner ships UNSIGNED (SmartScreen warns
      # on download, the installer still runs). The matched mode is written as
      # a bundle-config OVERLAY that `tauri build` merges via a second
      # --config, so the app repo commits no thumbprint and no issuer-specific
      # command, and the same config builds unsigned on a contributor's
      # machine.
      #
      # Partially-configured modes are a hard error, not a silent fall-through
      # to unsigned: half a credential set means someone intended to sign, and
      # discovering that from an unsigned artifact after publish is far more
      # expensive than failing here.
      - name: Configure Windows code signing
        id: win_sign
        if: matrix.os_name == 'windows'
        shell: pwsh
        env:
          SIGN_COMMAND: ${{ inputs.windows_sign_command }}
          AZURE_ENDPOINT: ${{ inputs.windows_azure_endpoint }}
          AZURE_ACCOUNT: ${{ inputs.windows_azure_account }}
          AZURE_CERT_PROFILE: ${{ inputs.windows_azure_cert_profile }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_URL: ${{ inputs.windows_timestamp_url }}
          DIGEST_ALGORITHM: ${{ inputs.windows_digest_algorithm }}
          APP_NAME: ${{ inputs.app_display_name }}
          OVERLAY_DIR: ${{ inputs.project_path }}/src-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          $overlayRel = 'src-tauri/.release-kit.windows-sign.conf.json'
          $overlayAbs = Join-Path $env:OVERLAY_DIR '.release-kit.windows-sign.conf.json'
          $windows = $null
          $mode = 'none'

          $hasAzureCreds = $env:AZURE_CLIENT_ID -and $env:AZURE_CLIENT_SECRET -and $env:AZURE_TENANT_ID
          $hasAzureInputs = $env:AZURE_ENDPOINT -and $env:AZURE_ACCOUNT -and $env:AZURE_CERT_PROFILE

          if ($env:SIGN_COMMAND) {
            # Escape hatch: any issuer CLI. %1 is where tauri substitutes the
            # file being signed — without it the command silently signs
            # nothing at all.
            if ($env:SIGN_COMMAND -notmatch '%1') {
              Write-Output "::error::windows_sign_command must contain the %1 placeholder for the file to sign"
              exit 1
            }
            $mode = 'command'
            # Object notation, not the string one: tauri splits a signCommand
            # STRING on plain spaces with no quote handling, so a quoted
            # argument becomes two broken ones. Splitting here and emitting
            # {cmd, args} keeps that behaviour explicit — a caller who needs
            # whitespace inside one argument should use an argument file or a
            # wrapper script.
            $parts = $env:SIGN_COMMAND -split '\s+' | Where-Object { $_ }
            $windows = @{ signCommand = @{
              cmd  = $parts[0]
              args = @($parts[1..($parts.Length - 1)])
            } }
          }
          elseif ($hasAzureCreds -or $hasAzureInputs) {
            if (-not $hasAzureCreds) {
              Write-Output "::error::windows_azure_* inputs are set but the AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID secrets are not — Azure Artifact Signing cannot authenticate"
              exit 1
            }
            if (-not $hasAzureInputs) {
              Write-Output "::error::Azure credentials are present but windows_azure_endpoint / windows_azure_account / windows_azure_cert_profile are not all set"
              exit 1
            }
            $mode = 'azure'
            # artifact-signing-cli reads AZURE_* from the environment; it is
            # not preinstalled on the runner images.
            Write-Output "Installing artifact-signing-cli (a few minutes on a cold cargo cache)..."
            cargo install artifact-signing-cli --locked
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::Failed to install artifact-signing-cli — cannot sign with Azure Artifact Signing"
              exit 1
            }
            # Object notation — the app display name routinely contains a
            # space, and tauri's string form would split it into two arguments.
            # -d is what the UAC prompt shows when a user runs an MSI; without
            # it the prompt names the installer with a random string.
            $windows = @{ signCommand = @{
              cmd  = 'artifact-signing-cli'
              args = @(
                '-e', $env:AZURE_ENDPOINT,
                '-a', $env:AZURE_ACCOUNT,
                '-c', $env:AZURE_CERT_PROFILE,
                '-d', $env:APP_NAME,
                '%1'
              )
            } }
          }
          elseif ($env:WINDOWS_CERTIFICATE) {
            if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
              Write-Output "::error::WINDOWS_CERTIFICATE is set but WINDOWS_CERTIFICATE_PASSWORD is not — a .pfx cannot be imported without its export password"
              exit 1
            }
            $mode = 'pfx'
            $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
            # Strip whitespace and any PEM-style armour before decoding:
            # `certutil -encode` wraps its output in BEGIN/END lines and hard
            # line breaks, `openssl base64 -A` produces neither, and both are
            # things people paste into this secret.
            $raw = ($env:WINDOWS_CERTIFICATE -replace '-{5}[^-]+-{5}', '') -replace '\s', ''
            try {
              [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($raw))
            } catch {
              Write-Output "::error::WINDOWS_CERTIFICATE is not valid base64 — produce it with 'openssl base64 -A -in certificate.pfx -out base64cert.txt'"
              exit 1
            }
            $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            try {
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            } catch {
              Write-Output "::error::Could not import the .pfx — wrong WINDOWS_CERTIFICATE_PASSWORD, or the file is not a PKCS#12 bundle containing the private key. ($($_.Exception.Message))"
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
              exit 1
            }
            Remove-Item $pfx -Force
            $thumb = $cert.Thumbprint
            if ($env:WINDOWS_CERTIFICATE_THUMBPRINT -and $env:WINDOWS_CERTIFICATE_THUMBPRINT -ne $thumb) {
              # The store now holds a different certificate than the pinned
              # one; signing with the wrong cert is worse than not signing.
              Write-Output "::error::Imported certificate thumbprint $thumb does not match the pinned WINDOWS_CERTIFICATE_THUMBPRINT"
              exit 1
            }
            $windows = @{
              certificateThumbprint = $thumb
              digestAlgorithm       = $env:DIGEST_ALGORITHM
              timestampUrl          = $env:TIMESTAMP_URL
            }
          }
          elseif ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            # Certificate already in the runner's store (self-hosted runner, or
            # an HSM/token whose CSP exposes it).
            $mode = 'thumbprint'
            $windows = @{
              certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
              digestAlgorithm       = $env:DIGEST_ALGORITHM
              timestampUrl          = $env:TIMESTAMP_URL
            }
          }

          if ($mode -eq 'none') {
            Write-Output "::notice::No Windows signing credentials configured — shipping UNSIGNED Windows installers. SmartScreen will warn users on download."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "mode=none"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "config_arg="
            exit 0
          }

          @{ bundle = @{ windows = $windows } } | ConvertTo-Json -Depth 6 |
            Set-Content -Path $overlayAbs -Encoding utf8
          Write-Output "Windows signing mode: $mode (overlay: $overlayRel)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "mode=$mode"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "config_arg=--config $overlayRel"

      # Linux artifact signing. One GPG key signs BOTH the AppImage (gpg via
      # appimagetool) and the RPM (tauri-bundler's own rpm signer); the .deb is
      # left unsigned because apt verifies repository signatures, not package
      # ones, and a standalone .deb download has no signature check to satisfy.
      #
      # Unsigned is a legitimate Linux release — nothing refuses to run — so an
      # absent key is a notice, not a failure. A key that is PRESENT but fails
      # to sign is a failure (APPIMAGETOOL_FORCE_SIGN below): appimagetool
      # otherwise emits a perfectly valid *unsigned* AppImage and exits 0.
      - name: Import Linux signing key
        id: linux_sign
        if: matrix.os_name == 'linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${LINUX_GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::No LINUX_GPG_PRIVATE_KEY — shipping unsigned Linux artifacts (nothing on Linux refuses to run them)."
            echo "signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY_FILE="${RUNNER_TEMP}/linux-signing.asc"
          # Accept the armored key directly or base64-wrapped (the GitHub
          # secrets UI mangles neither, but people reach for base64 anyway).
          if printf '%s' "$LINUX_GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          elif printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode 2>/dev/null | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          else
            echo "::error::LINUX_GPG_PRIVATE_KEY is neither an ASCII-armored private key nor base64 of one. Export it with 'gpg --armor --export-secret-keys <KEY_ID>'."
            exit 1
          fi
          chmod 600 "$KEY_FILE"

          # Loopback pinentry: without it gpg blocks forever on a passphrase
          # dialog no CI runner can answer, and the job dies at the 6h timeout.
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
          echo 'pinentry-mode loopback'  >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

          if [ -n "${LINUX_GPG_PASSPHRASE:-}" ]; then
            gpg --batch --yes --passphrase "$LINUX_GPG_PASSPHRASE" --import "$KEY_FILE"
          else
            gpg --batch --yes --import "$KEY_FILE"
          fi

          KEY_ID="${LINUX_GPG_KEY_ID:-}"
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          fi
          if [ -z "$KEY_ID" ]; then
            echo "::error::No secret key present after import — the key material did not load"
            exit 1
          fi
          # Ultimate ownertrust, or gpg refuses to sign non-interactively.
          printf '%s:6:\n' "$KEY_ID" | gpg --batch --import-ownertrust

          {
            echo "SIGN=1"
            echo "SIGN_KEY=${KEY_ID}"
            # Fail the bundle when signing fails instead of shipping an
            # unsigned AppImage that looks identical to a signed one.
            echo "APPIMAGETOOL_FORCE_SIGN=1"
            if [ -n "${LINUX_GPG_PASSPHRASE:-}" ]; then
              echo "APPIMAGETOOL_SIGN_PASSPHRASE=${LINUX_GPG_PASSPHRASE}"
              echo "TAURI_SIGNING_RPM_KEY_PASSPHRASE=${LINUX_GPG_PASSPHRASE}"
            fi
            # tauri-bundler wants the key MATERIAL, not a key id. Multi-line
            # values need GITHUB_ENV's heredoc form.
            echo "TAURI_SIGNING_RPM_KEY<<__RELEASE_KIT_RPM_KEY__"
            cat "$KEY_FILE"
            echo "__RELEASE_KIT_RPM_KEY__"
          } >> "$GITHUB_ENV"
          rm -f "$KEY_FILE"

          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"
          echo "Linux signing key ${KEY_ID} imported (AppImage + RPM)."

      # Optional telemetry wiring: apps that report to Sentry set the
      # SENTRY_DSN / SENTRY_AUTH_TOKEN secrets and read the env at build time
      # (VITE_SENTRY_DSN for the frontend bundle). Non-empty-only for the same
      # reason as the Apple step — an empty-but-set DSN is not "unset" to the
      # consuming SDKs. No-op for apps without the secrets.
      - name: Export Sentry env (non-empty only)
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SENTRY_DSN:-}" ]; then
            echo "SENTRY_DSN=${SENTRY_DSN}" >> "$GITHUB_ENV"
            echo "VITE_SENTRY_DSN=${SENTRY_DSN}" >> "$GITHUB_ENV"
          fi
          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}" >> "$GITHUB_ENV"
          fi

      # releases_repo token via the GitHub App (see create-release). Minted right
      # before the build: installation tokens live one hour, and tauri-action
      # uploads when the build finishes (README: a leg that builds for longer
      # than ~50 minutes needs RELEASES_TOKEN instead).
      - name: Mint releases-repo token (GitHub App)
        id: app_token
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repositories: ${{ needs.check-changelog.outputs.releases_name }}
          permission-contents: write

      - name: Build and upload via tauri-action
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Writes assets to the releases repo; the default GITHUB_TOKEN cannot
          # write cross-repo, so RELEASES_TOKEN wins when configured.
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Empty-set is CORRECT for passwordless keys (var_os → Some("")).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's bundled strip pass breaks against the ubuntu-24.04
          # (20260714+) images' binutils ("failed to run linuxdeploy" even with
          # FUSE installed). Harmless elsewhere; the shipped binary is already
          # stripped by cargo's release profile.
          NO_STRIP: 'true'
        with:
          projectPath: ${{ inputs.project_path }}
          tauriScript: pnpm tauri
          # Config files merge in the order given (tauri CLI `--config` is a
          # Vec): the per-OS bundle overlay first, then the signing overlay
          # this run generated (empty on every leg without one). `--bundles`
          # is the plan job's per-leg format list, already degraded for
          # combinations the toolchain cannot produce.
          args: --target ${{ matrix.target }} --config ${{ matrix.config }} ${{ steps.win_sign.outputs.config_arg }} --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # The release id may live on the (public) releases repo, so point
          # tauri-action at it explicitly — its API calls default to
          # context.repo, where a cross-repo id does not exist.
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repo: ${{ needs.check-changelog.outputs.releases_name }}
          # latest.json is assembled by create-updater-json below. NOTE: the
          # input is `uploadUpdaterJson` on tauri-action v1 — the old
          # `includeUpdaterJson` name is silently ignored (dead input) and lets
          # tauri-action upload its own latest.json alongside ours.
          uploadUpdaterJson: false

      # macOS Gatekeeper gate. tauri-action emits an UNSIGNED bundle (rather
      # than failing) when signing secrets are absent, so a silently
      # un-notarized release is otherwise possible. When signing IS configured,
      # fail unless the output is signed + notarized + stapled.
      - name: Verify macOS signing + notarization
        if: matrix.os_name == 'darwin'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BUNDLES: ${{ matrix.bundles }}
          BUNDLE_DIR: ${{ inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}/target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::APPLE_SIGNING_IDENTITY unset — shipping an UNSIGNED macOS build. Downloaded Apple Silicon builds are reported as \"damaged\" unless the bundle config sets an ad-hoc identity (\"signingIdentity\": \"-\")."
            exit 0
          fi
          APP="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -z "$APP" ]; then
            echo "::error::Could not locate the built .app under $BUNDLE_DIR/macos" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Only the DMG carries the stapled notarization ticket, and it only
          # exists when `dmg` is in this leg's bundle list.
          case ",$BUNDLES," in
            *,dmg,*)
              DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -print -quit 2>/dev/null || true)"
              if [ -z "$DMG" ]; then
                echo "::error::dmg is in this leg's bundle list but no .dmg was produced under $BUNDLE_DIR/dmg" >&2
                exit 1
              fi
              spctl -a -vvv -t install "$DMG"
              xcrun stapler validate "$DMG"
              echo "macOS signing + notarization verified (app + dmg)."
              ;;
            *)
              echo "macOS signing verified (no dmg in this leg's bundle list — notarization ticket not checked)."
              ;;
          esac

      # SmartScreen gate. tauri-bundler does not fail the build when a sign
      # command is misconfigured or a certificate is unusable, so without this
      # step a "signed" release can ship entirely unsigned. Chain-of-trust
      # problems are a warning (the runner's trust store is not the user's);
      # a missing or broken signature is an error.
      - name: Verify Windows signatures
        if: matrix.os_name == 'windows' && steps.win_sign.outputs.mode != 'none'
        shell: pwsh
        env:
          SIGN_MODE: ${{ steps.win_sign.outputs.mode }}
          BUNDLE_DIR: ${{ inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}/target/${{ matrix.target }}/release/bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @()
          foreach ($pattern in @('nsis/*.exe', 'msi/*.msi')) {
            $installers += Get-ChildItem -Path (Join-Path $env:BUNDLE_DIR $pattern) -ErrorAction SilentlyContinue
          }
          if ($installers.Count -eq 0) {
            Write-Output "::error::Windows signing mode is '$($env:SIGN_MODE)' but no installer was found under $($env:BUNDLE_DIR)"
            exit 1
          }
          $failed = $false
          foreach ($file in $installers) {
            $sig = Get-AuthenticodeSignature $file.FullName
            switch ($sig.Status) {
              'Valid' {
                Write-Output "signed  $($file.Name)  [$($sig.SignerCertificate.Subject)]"
              }
              { $_ -in 'NotSigned', 'HashMismatch' } {
                Write-Output "::error::$($file.Name): $($sig.Status) — signing mode '$($env:SIGN_MODE)' produced no valid signature"
                $failed = $true
              }
              default {
                # UnknownError / NotTrusted: a signature exists but this
                # runner cannot chain it to a trusted root. Normal for
                # internal CAs and for Azure Artifact Signing's short-lived
                # certificates.
                Write-Output "::warning::$($file.Name): signature present but not verifiable on this runner ($($sig.Status)) — check it against a real user machine"
              }
            }
          }
          if ($failed) { exit 1 }

      # A Linux binary needs the glibc of the image it was built on, and a too
      # new one fails on users' machines at startup ("version 'GLIBC_2.39'
      # not found"). Report what each leg's binaries need; glibc_max turns the
      # report into a gate.
      - name: Check the glibc floor
        if: matrix.os_name == 'linux'
        env:
          RELEASE_DIR: ${{ inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}/target/${{ matrix.target }}/release
          TARGET: ${{ matrix.target }}
          GLIBC_MAX: ${{ inputs.glibc_max }}
        run: |
          set -euo pipefail
          FLOOR=""
          while IFS= read -r -d '' BIN; do
            file "$BIN" | grep -q ELF || continue
            NEED="$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -V | tail -1 || true)"
            [ -n "$NEED" ] || continue
            echo "$(basename "$BIN") needs glibc ${NEED}"
            FLOOR="$(printf '%s\n%s\n' "$FLOOR" "$NEED" | sed '/^$/d' | sort -V | tail -1)"
          done < <(find "$RELEASE_DIR" -maxdepth 1 -type f -perm -u+x -print0)
          [ -n "$FLOOR" ] || { echo "::error::No Linux binary found in ${RELEASE_DIR}"; exit 1; }
          echo "### ${TARGET}: needs glibc ${FLOOR}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$GLIBC_MAX" ] && [ "$(printf '%s\n%s\n' "$GLIBC_MAX" "$FLOOR" | sort -V | tail -1)" != "$GLIBC_MAX" ]; then
            echo "::error::${TARGET} needs glibc ${FLOOR}, above glibc_max ${GLIBC_MAX} - build on an older image (linux_*_runner)"
            exit 1
          fi

      # The kit's own scripts, at the commit the caller pinned. Checked out
      # AFTER tauri-action so its config/workspace discovery never sees them.
      - name: Check out the kit's scripts
        if: inputs.smoke_test || (matrix.os_name == 'darwin' && inputs.macos_linkage_check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false

      - name: Confirm the kit checkout
        if: inputs.smoke_test || (matrix.os_name == 'darwin' && inputs.macos_linkage_check)
        shell: bash
        run: |
          test -f .release-kit/scripts/verify-release.mjs \
            || { echo "::error::The kit checkout did not resolve (job.workflow_repository/job.workflow_sha) — no scripts/verify-release.mjs"; exit 1; }

      # A binary or sidecar linked against a Homebrew library records that
      # absolute path; the runner has the file, so the leg builds, notarizes
      # and launches, and every user machine without the formula crashes with
      # "dyld: Library not loaded". Notarization never looks at load paths.
      # One otool -L per Mach-O file (scripts/check-macos-linkage.sh).
      - name: Check macOS library linkage
        if: matrix.os_name == 'darwin' && inputs.macos_linkage_check
        env:
          BUNDLE_DIR: ${{ inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}/target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          # `app` is mandatory on darwin legs (the plan job enforces it).
          APP="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          [ -n "$APP" ] || { echo "::error::No .app under ${BUNDLE_DIR}/macos to check"; exit 1; }
          bash .release-kit/scripts/check-macos-linkage.sh "$APP"

      # Opt-in (smoke_test): signatures say an artifact is ours, not that it
      # installs or starts. Launching needs the runner to execute the target's
      # code, so a cross-arch leg (the darwin-x86_64 leg on an Apple Silicon
      # runner) is skipped with a notice rather than trusted to emulation.
      # Details in each scripts/smoke-*.
      - name: Smoke-test packages
        if: inputs.smoke_test
        shell: bash
        env:
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          VERSION: ${{ needs.check-changelog.outputs.version }}
          BUNDLE_DIR: ${{ inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}/target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}/${ARCH}" in
            X64/x86_64|ARM64/aarch64) ;;
            *)
              echo "::notice::Skipping the package smoke test on ${TARGET}: this ${RUNNER_ARCH} runner cannot natively run ${ARCH} code."
              exit 0
              ;;
          esac
          BARE="${VERSION#v}"
          case "$OS_NAME" in
            linux)
              sudo apt-get install -y xvfb xauth
              bash .release-kit/scripts/smoke-linux.sh "$BUNDLE_DIR" "$BARE" "$BUNDLES"
              ;;
            darwin)
              bash .release-kit/scripts/smoke-macos.sh "$BUNDLE_DIR" "$BUNDLES"
              ;;
            windows)
              pwsh -NoProfile -File .release-kit/scripts/smoke-windows.ps1 -BundleDir "$BUNDLE_DIR" -Version "$BARE" -Bundles "$BUNDLES"
              ;;
          esac

      # Opt-in (webdriver_smoke): the app's own UI check, driven through
      # tauri-driver on the built binary - the smoke test above proves the
      # app starts, this proves it renders. Native Linux legs only (tauri-
      # driver has no macOS driver; Windows needs msedgedriver pinned to the
      # runner's WebView2). Details in scripts/webdriver-smoke.sh.
      - name: WebDriver boot gate
        if: inputs.webdriver_smoke != '' && matrix.os_name == 'linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          SMOKE_COMMAND: ${{ inputs.webdriver_smoke }}
          BINARY_NAME: ${{ inputs.webdriver_binary }}
          RELEASE_DIR: ${{ inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}/target/${{ matrix.target }}/release
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}/${ARCH}" in
            X64/x86_64|ARM64/aarch64) ;;
            *)
              echo "::notice::Skipping the WebDriver boot gate on ${TARGET}: this ${RUNNER_ARCH} runner cannot natively run ${ARCH} code."
              exit 0
              ;;
          esac
          if [ -z "$BINARY_NAME" ]; then
            echo "::error::webdriver_smoke is set but webdriver_binary is empty"
            exit 1
          fi
          # SMOKE_COMMAND is a trusted workflow input (the caller's own release.yml), split into words.
          read -r -a COMMAND <<< "$SMOKE_COMMAND"
          bash .release-kit/scripts/webdriver-smoke.sh "$RELEASE_DIR/$BINARY_NAME" "${COMMAND[@]}"

      # AppImage and RPM signature verification. APPIMAGETOOL_FORCE_SIGN
      # already fails the bundle on a signing error, so this catches the
      # subtler case: signing that "succeeded" against a key nothing can
      # verify. All findings here are warnings — the artifacts are already
      # built and Linux gates nothing on signatures.
      - name: Verify Linux signatures
        if: matrix.os_name == 'linux' && steps.linux_sign.outputs.signing == 'true'
        env:
          KEY_ID: ${{ steps.linux_sign.outputs.key_id }}
          BUNDLES: ${{ matrix.bundles }}
          BUNDLE_DIR: ${{ inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}/target/${{ matrix.target }}/release/bundle
        run: |
          set -uo pipefail
          case ",$BUNDLES," in *,appimage,*)
            APPIMAGE="$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -name '*.AppImage' -print -quit 2>/dev/null || true)"
            if [ -z "$APPIMAGE" ]; then
              echo "::warning::appimage is in this leg's bundle list but no .AppImage was found to verify"
            elif "$APPIMAGE" --appimage-signature 2>/dev/null | grep -q 'PGP SIGNATURE'; then
              echo "AppImage carries an embedded signature ($(basename "$APPIMAGE"))."
            else
              echo "::warning::$(basename "$APPIMAGE") has no readable embedded signature. Note that AppImage NEVER validates its own signature — publish the key fingerprint ${KEY_ID} over TLS so users can check it with the AppImage validate tool."
            fi
          ;; esac
          case ",$BUNDLES," in *,rpm,*)
            RPM="$(find "$BUNDLE_DIR/rpm" -maxdepth 1 -name '*.rpm' -print -quit 2>/dev/null || true)"
            if [ -z "$RPM" ]; then
              echo "::warning::rpm is in this leg's bundle list but no .rpm was found to verify"
            elif ! command -v rpm >/dev/null 2>&1; then
              echo "::warning::rpm(1) unavailable — skipping RPM signature check"
            else
              gpg --armor --export "$KEY_ID" > "${RUNNER_TEMP}/RPM-GPG-KEY"
              # One explicit keyring database for the import and the check. The key
              # used to go in with `sudo rpm --import` while the check ran as the
              # runner user, and Debian's rpm keeps a per-user database — so the
              # check never saw the key and every signed RPM warned "not signed"
              # (reproduced on ubuntu:24.04: "digests SIGNATURES NOT OK" that way,
              # "digests signatures OK" this way). Same fix as linux-release-kit.
              RPMDB="${RUNNER_TEMP}/rpmdb"
              mkdir -p "$RPMDB"
              if ! rpmkeys --dbpath "$RPMDB" --import "${RUNNER_TEMP}/RPM-GPG-KEY"; then
                echo "::warning::Could not import ${KEY_ID} into a scratch rpm keyring — RPM signature not checked"
              else
                CHECK="$(rpm --dbpath "$RPMDB" -K "$RPM" 2>&1 || true)"
                if printf '%s' "$CHECK" | grep -qi 'signatures OK'; then
                  echo "RPM signature verified against ${KEY_ID} ($(basename "$RPM"))."
                else
                  echo "::warning::$(basename "$RPM") did not verify against ${KEY_ID}: ${CHECK}"
                fi
              fi
            fi
          ;; esac

  create-updater-json:
    needs: [check-changelog, create-release, build-and-release, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    # Reads the draft's assets and uploads the manifest to it.
    permissions:
      contents: write
    if: ${{ !cancelled() && needs.build-and-release.result == 'success' }}
    steps:
      # releases_repo token via the GitHub App (see create-release).
      - name: Mint releases-repo token (GitHub App)
        id: app_token
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repositories: ${{ needs.check-changelog.outputs.releases_name }}
          permission-contents: write

      - name: Generate updater JSON
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          CHANNEL: ${{ needs.create-release.outputs.channel }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          REL_NAME: ${{ needs.check-changelog.outputs.releases_name }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        with:
          github-token: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION;
            const channel = process.env.CHANNEL;
            const releaseId = Number(process.env.RELEASE_ID);
            const owner = process.env.REL_OWNER;
            const repo = process.env.REL_NAME;

            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id });

            // `size` (bytes) is a kit extension the Tauri plugin ignores;
            // apps read it from the manifest to show download size BEFORE the
            // user commits to an update.
            //
            // The platform skeleton is the app's SHIPPED target set (plan's
            // `targets` output), not this run's build set — on a retry run
            // the previously-built legs' assets are already on the draft and
            // must land in the manifest too.
            const platforms = Object.fromEntries(
              process.env.TARGETS.split(',').map((t) => [t, { signature: null, url: null, size: null }]),
            );

            // First-match-wins predicates over asset filenames. Windows uses
            // the NSIS *-setup.exe on both arches (no MSI in CI — see matrix).
            const matchers = [
              { key: 'darwin-aarch64', kind: 'url', test: (n) => n.endsWith('.app.tar.gz') && n.includes('aarch64') },
              { key: 'darwin-aarch64', kind: 'sig', test: (n) => n.endsWith('.app.tar.gz.sig') && n.includes('aarch64') },
              { key: 'darwin-x86_64', kind: 'url', test: (n) => n.endsWith('.app.tar.gz') && n.includes('x64') },
              { key: 'darwin-x86_64', kind: 'sig', test: (n) => n.endsWith('.app.tar.gz.sig') && n.includes('x64') },
              { key: 'windows-x86_64', kind: 'url', test: (n) => n.endsWith('.exe') && /(_|-)x64(_|-|\.)/i.test(n) },
              { key: 'windows-x86_64', kind: 'sig', test: (n) => n.endsWith('.exe.sig') && /(_|-)x64(_|-|\.)/i.test(n) },
              { key: 'windows-aarch64', kind: 'url', test: (n) => n.endsWith('.exe') && /(_|-)arm64(_|-|\.)/i.test(n) },
              { key: 'windows-aarch64', kind: 'sig', test: (n) => n.endsWith('.exe.sig') && /(_|-)arm64(_|-|\.)/i.test(n) },
              { key: 'linux-x86_64', kind: 'url', test: (n) => n.endsWith('.AppImage') && /(_|-)amd64\b/i.test(n) },
              { key: 'linux-x86_64', kind: 'sig', test: (n) => n.endsWith('.AppImage.sig') && /(_|-)amd64\b/i.test(n) },
              { key: 'linux-aarch64', kind: 'url', test: (n) => n.endsWith('.AppImage') && /(_|-)aarch64\b/i.test(n) },
              { key: 'linux-aarch64', kind: 'sig', test: (n) => n.endsWith('.AppImage.sig') && /(_|-)aarch64\b/i.test(n) },
              // Installer-specific entries: tauri-plugin-updater tries `<os>-<arch>-<installer>`
              // before `<os>-<arch>`, so a .deb/.rpm install updates from its own package
              // (dpkg / rpm through pkexec) instead of being handed the AppImage.
              { key: 'linux-x86_64-deb', base: 'linux-x86_64', kind: 'url', test: (n) => n.endsWith('_amd64.deb') },
              { key: 'linux-x86_64-deb', base: 'linux-x86_64', kind: 'sig', test: (n) => n.endsWith('_amd64.deb.sig') },
              { key: 'linux-x86_64-rpm', base: 'linux-x86_64', kind: 'url', test: (n) => n.endsWith('.x86_64.rpm') },
              { key: 'linux-x86_64-rpm', base: 'linux-x86_64', kind: 'sig', test: (n) => n.endsWith('.x86_64.rpm.sig') },
              { key: 'linux-aarch64-deb', base: 'linux-aarch64', kind: 'url', test: (n) => n.endsWith('_arm64.deb') },
              { key: 'linux-aarch64-deb', base: 'linux-aarch64', kind: 'sig', test: (n) => n.endsWith('_arm64.deb.sig') },
              { key: 'linux-aarch64-rpm', base: 'linux-aarch64', kind: 'url', test: (n) => n.endsWith('.aarch64.rpm') },
              { key: 'linux-aarch64-rpm', base: 'linux-aarch64', kind: 'sig', test: (n) => n.endsWith('.aarch64.rpm.sig') },
            ];

            const fetchSignatureBody = async (assetId) => {
              const sig = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: assetId, headers: { accept: 'application/octet-stream' },
              });
              return Buffer.from(sig.data).toString('utf8');
            };

            // URLs are built DETERMINISTICALLY from the tag path, not from
            // asset.browser_download_url: on a draft release that URL contains
            // an `untagged-<hash>` path that 404s publicly and BREAKS after
            // the draft is published under its real tag.
            const tagBase = `https://github.com/${owner}/${repo}/releases/download/${version}/`;
            const installerKeys = new Set();
            for (const asset of assets) {
              for (const matcher of matchers) {
                // Matchers for platforms outside the app's target set are inert.
                const shipped = matcher.base ? matcher.base in platforms : matcher.key in platforms;
                if (!shipped || !matcher.test(asset.name)) continue;
                if (matcher.base && !(matcher.key in platforms)) {
                  platforms[matcher.key] = { signature: null, url: null, size: null };
                  installerKeys.add(matcher.key);
                }
                if (matcher.kind === 'url') {
                  platforms[matcher.key].url = tagBase + encodeURIComponent(asset.name);
                  platforms[matcher.key].size = asset.size;
                } else {
                  platforms[matcher.key].signature = await fetchSignatureBody(asset.id);
                }
                break;
              }
            }

            // An installer entry needs both its package and the package's updater
            // signature (a CLI too old to sign .deb/.rpm writes none); without both,
            // those installs keep updating through their package manager.
            for (const key of installerKeys) {
              if (!platforms[key].url || !platforms[key].signature) delete platforms[key];
            }

            // Incomplete entries stay: verify-release fails loudly rather than
            // silently shipping a manifest missing a target.
            const updateManifest = {
              version: version.replace(/^v/, ''),
              notes: release.body || 'No release notes provided',
              pub_date: release.published_at || new Date().toISOString(),
              platforms,
            };

            const manifestName = channel === 'stable' ? 'latest.json' : `latest-${channel}.json`;
            // A retry run's draft already carries the previous attempt's
            // manifest; uploading a same-named asset would 422, so replace it.
            const staleManifest = assets.find((a) => a.name === manifestName);
            if (staleManifest) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: staleManifest.id });
              core.info(`Replaced stale ${manifestName} from a previous attempt.`);
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name: manifestName,
              data: Buffer.from(JSON.stringify(updateManifest, null, 2), 'utf8'),
            });
            console.log(`Uploaded ${manifestName} for channel ${channel}`);

  # One SHA256SUMS over every asset on the draft (all legs, including ones a
  # previous attempt uploaded, plus the updater manifest and the SBOMs),
  # GPG-signed when LINUX_GPG_PRIVATE_KEY is set. Same file names and format
  # as linux-release-kit's checksums job. It runs after the last leg and after
  # create-updater-json, so nothing it lists changes before publish — and if a
  # retried leg re-uploads afterwards, verify-release catches the digest drift.
  checksums:
    needs: [check-changelog, create-release, build-and-release, create-updater-json]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Downloads from and uploads to the draft (same-repo mode).
    permissions:
      contents: write
    if: needs.build-and-release.result == 'success' && needs.create-updater-json.result == 'success'
    outputs:
      # Not the key id: when LINUX_GPG_KEY_ID is a secret the runner drops an output
      # equal to it, and verify-release would expect no signature at all.
      signed: ${{ steps.sign.outputs.key_id != '' }}
    steps:
      # The SBOM describes the tagged source, the same ref the legs built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check-changelog.outputs.sha }}
          path: app

      - name: Check out the kit's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false

      - name: Confirm the kit checkout
        run: |
          test -f .release-kit/scripts/verify-release.mjs \
            || { echo "::error::The kit checkout did not resolve (job.workflow_repository/job.workflow_sha) — no scripts/verify-release.mjs"; exit 1; }

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # The action's default (1.51.1) predates the fix for GHSA-mw2c-m758-9v5q.
          syft-version: v1.52.0

      # A source-level SBOM (every locked dependency Syft recognises —
      # Cargo.lock, pnpm-lock.yaml, …) in both formats scanners ingest,
      # generated before SHA256SUMS so the sums and their signature cover it.
      # Named <productName>_<version> by the same code verify-release uses.
      - name: Generate SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SRC_TAURI: app/${{ inputs.project_path }}/src-tauri
          BARE_VERSION: ${{ needs.check-changelog.outputs.version }}
        run: |
          set -euo pipefail
          BARE="${BARE_VERSION#v}"
          PRODUCT="$(node .release-kit/scripts/verify-release.mjs product "$SRC_TAURI")"
          SBOM="${RUNNER_TEMP}/sbom"
          mkdir -p "$SBOM"
          "$SYFT" scan dir:app --source-name "$PRODUCT" --source-version "$BARE" \
            -o "spdx-json=${SBOM}/${PRODUCT}_${BARE}.spdx.json" \
            -o "cyclonedx-json=${SBOM}/${PRODUCT}_${BARE}.cdx.json"
          ls -l "$SBOM"

      # The same key the Linux legs sign the AppImage and RPM with. Unset is a
      # legitimate release (the sums still ship, unsigned); a key that will not
      # import or sign fails the job.
      - name: Import signing key
        id: sign
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${LINUX_GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::No LINUX_GPG_PRIVATE_KEY — SHA256SUMS ships unsigned."
            echo "key_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEY_FILE="${RUNNER_TEMP}/linux-signing.asc"
          if printf '%s' "$LINUX_GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          elif printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode 2>/dev/null | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          else
            echo "::error::LINUX_GPG_PRIVATE_KEY is neither an ASCII-armored private key nor base64 of one."
            exit 1
          fi
          # Loopback pinentry, or gpg blocks on a passphrase prompt until the timeout.
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
          echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          gpg --batch --yes ${LINUX_GPG_PASSPHRASE:+--passphrase "$LINUX_GPG_PASSPHRASE"} --import "$KEY_FILE"
          rm -f "$KEY_FILE"
          KEY_ID="${LINUX_GPG_KEY_ID:-$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')}"
          [ -n "$KEY_ID" ] || { echo "::error::No secret key present after import"; exit 1; }
          printf '%s:6:\n' "$KEY_ID" | gpg --batch --import-ownertrust
          echo "key_id=${KEY_ID}" >> "$GITHUB_OUTPUT"

      # releases_repo token via the GitHub App (see create-release).
      - name: Mint releases-repo token (GitHub App)
        id: app_token
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repositories: ${{ needs.check-changelog.outputs.releases_name }}
          permission-contents: write

      - name: Generate, sign and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.check-changelog.outputs.releases_owner }}/${{ needs.check-changelog.outputs.releases_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.check-changelog.outputs.version }}
          KEY_ID: ${{ steps.sign.outputs.key_id }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          COMMIT: ${{ needs.check-changelog.outputs.sha }}
          KIT: ${{ job.workflow_repository }}
          KIT_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # GitHub's asset API fails transiently now and then; retry a call before failing the job.
          retry() { local n=1; until "$@"; do [ "$n" -ge 3 ] && return 1; sleep $((n * 15)); n=$((n + 1)); done; }
          WORK="${RUNNER_TEMP}/sums"
          mkdir -p "$WORK" && cd "$WORK"
          # By asset id: draft assets have no public URL. SHA256SUMS, its
          # signature, the public key and the SBOMs are regenerated below, so a
          # retry run's copies from the previous attempt are not summed.
          gh api --paginate "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' > "${RUNNER_TEMP}/assets.tsv"
          while IFS=$'\t' read -r id name; do
            case "$name" in SHA256SUMS|*.asc|*.spdx.json|*.cdx.json|*.sigstore.json|provenance.json) continue ;; esac
            retry gh api -H 'Accept: application/octet-stream' "repos/${REPO}/releases/assets/${id}" > "$name"
          done < "${RUNNER_TEMP}/assets.tsv"
          cp "${RUNNER_TEMP}"/sbom/* .
          set -- *
          [ -e "$1" ] || { echo "::error::No assets on ${REPO}@${TAG} to checksum"; exit 1; }
          # provenance.json: where the release was built from and the SHA-256 of every asset, as
          # one machine-readable file (listed in SHA256SUMS, so its signature covers it too).
          sha256sum -- "$@" | jq -R 'capture("^(?<sha256>[a-f0-9]{64}) [ *](?<name>.+)$")' | jq -s \
            --arg repository "$GITHUB_REPOSITORY" --arg commit "$COMMIT" --arg tag "$TAG" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg kit "${KIT}@${KIT_SHA}" \
            '{schema: "tauri-release-kit/provenance@1", repository: $repository, commit: $commit,
              tag: $tag, workflow_run: $run, kit: $kit, generated_at: (now | todate), assets: .}' \
            > provenance.json
          set -- *
          sha256sum -- "$@" > SHA256SUMS
          cat SHA256SUMS
          UPLOAD=(SHA256SUMS provenance.json "${RUNNER_TEMP}"/sbom/*)
          if [ -n "$KEY_ID" ]; then
            gpg --batch --yes -u "$KEY_ID" ${LINUX_GPG_PASSPHRASE:+--passphrase "$LINUX_GPG_PASSPHRASE"} \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
            gpg --verify SHA256SUMS.asc SHA256SUMS
            # The public key next to the artifacts, so verification instructions
            # can point at a URL that moves with the release.
            gpg --armor --export "$KEY_ID" > "${KEY_ID}.asc"
            UPLOAD+=(SHA256SUMS.asc "${KEY_ID}.asc")
          fi
          retry gh release upload "$TAG" "${UPLOAD[@]}" --repo "$REPO" --clobber

      # GitHub shows an asset's label in place of its file name: "macOS (Apple Silicon) · disk
      # image" instead of MyApp_1.2.3_aarch64.dmg (scripts/asset-labels.mjs). The names - which
      # the updater manifest uses - don't change. The cosign job labels its bundles itself.
      - name: Label the release assets
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.check-changelog.outputs.releases_owner }}/${{ needs.check-changelog.outputs.releases_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: bash .release-kit/scripts/label-assets.sh

  # Build provenance for every file SHA256SUMS lists, once, after the last
  # asset is on the draft — one job holding id-token instead of one per leg.
  # The attestation is stored on the repository RUNNING this workflow (the
  # app repo), even when releases live on releases_repo; verify with
  # `gh attestation verify <file> --repo <app repo> --signer-repo <this kit>`
  # (docs/SIGNING.md). --signer-repo is required because a reusable workflow
  # signs.
  #
  # GitHub offers attestations for public repositories on every plan, but for
  # private/internal ones only on Enterprise Cloud. A private app repo on
  # Free/Pro/Team therefore fails the attest call; that is a plan limit, not a
  # broken release, so it is a warning and the release proceeds.
  attest:
    needs: [check-changelog, create-release, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: write        # SHA256SUMS is read from the still-draft release
      id-token: write        # Sigstore signing certificate
      attestations: write    # store the attestation on this repository
    steps:
      # releases_repo token via the GitHub App (see create-release).
      - name: Mint releases-repo token (GitHub App)
        id: app_token
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repositories: ${{ needs.check-changelog.outputs.releases_name }}
          permission-contents: write

      - name: Download SHA256SUMS
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.check-changelog.outputs.releases_owner }}/${{ needs.check-changelog.outputs.releases_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          ID="$(gh api --paginate "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[] | select(.name == "SHA256SUMS") | .id')"
          [ -n "$ID" ] || { echo "::error::SHA256SUMS is not on the draft"; exit 1; }
          mkdir -p "${RUNNER_TEMP}/attest"
          gh api -H 'Accept: application/octet-stream' "repos/${REPO}/releases/assets/${ID}" > "${RUNNER_TEMP}/attest/SHA256SUMS"
          cat "${RUNNER_TEMP}/attest/SHA256SUMS"

      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/attest/SHA256SUMS

      - name: Report attestation outcome
        env:
          OUTCOME: ${{ steps.attest.outcome }}
          PRIVATE: ${{ github.event.repository.private }}
          KIT: ${{ job.workflow_repository }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice::Build provenance attested for every file in SHA256SUMS (stored on ${GITHUB_REPOSITORY}). Verify with: gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-repo ${KIT}"
          elif [ "$PRIVATE" = "true" ]; then
            echo "::warning::Artifact attestation failed on private ${GITHUB_REPOSITORY}. Private repositories get attestations only on GitHub Enterprise Cloud; on Free/Pro/Team this is expected. The release continues without provenance."
          else
            echo "::warning::Artifact attestation failed on public ${GITHUB_REPOSITORY} (see the step above). The release continues without provenance."
          fi

  # Opt-in (cosign_sign): keyless Sigstore bundles for SHA256SUMS (which covers every other asset)
  # and for each AppImage, the one Linux format with no signature of its own a user's tools check.
  # Runs after checksums so the bundles are not in the sums; verify-release expects them.
  cosign:
    needs: [check-changelog, create-release, checksums]
    if: inputs.cosign_sign && needs.checksums.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write        # reads and uploads to the draft (same-repo mode)
      id-token: write        # the OIDC token Fulcio issues the signing certificate for
    steps:
      # releases_repo token via the GitHub App (see create-release).
      - name: Mint releases-repo token (GitHub App)
        id: app_token
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repositories: ${{ needs.check-changelog.outputs.releases_name }}
          permission-contents: write

      - name: Check out the kit's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign SHA256SUMS and the AppImages, upload the bundles
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.check-changelog.outputs.releases_owner }}/${{ needs.check-changelog.outputs.releases_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.check-changelog.outputs.version }}
          KIT: ${{ job.workflow_repository }}
          KIT_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/cosign"
          mkdir -p "$WORK" && cd "$WORK"
          retry() { local n=1; until "$@"; do [ "$n" -ge 3 ] && return 1; sleep $((n * 15)); n=$((n + 1)); done; }
          gh api --paginate "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | select(.name == "SHA256SUMS" or (.name | endswith(".AppImage"))) | [.id, .name] | @tsv' \
            > "${RUNNER_TEMP}/cosign-assets.tsv"
          grep -q $'\tSHA256SUMS$' "${RUNNER_TEMP}/cosign-assets.tsv" \
            || { echo "::error::SHA256SUMS is not on the draft"; exit 1; }
          BUNDLES=()
          while IFS=$'\t' read -r id name; do
            retry gh api -H 'Accept: application/octet-stream' "repos/${REPO}/releases/assets/${id}" > "$name"
            cosign sign-blob --yes --bundle "${name}.sigstore.json" "$name"
            BUNDLES+=("${name}.sigstore.json")
          done < "${RUNNER_TEMP}/cosign-assets.tsv"
          retry gh release upload "$TAG" "${BUNDLES[@]}" --repo "$REPO" --clobber
          # A reusable workflow signs as itself: the certificate names the kit's workflow file.
          echo "::notice::Signed ${#BUNDLES[@]} files with Sigstore as ${GITHUB_SERVER_URL}/${KIT}/.github/workflows/release.yml@${KIT_SHA} - verify with docs/SIGNING.md, \"Sigstore bundles\"."

      - name: Label the bundles
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ needs.check-changelog.outputs.releases_owner }}/${{ needs.check-changelog.outputs.releases_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: bash .release-kit/scripts/label-assets.sh

  verify-release:
    # Fail loud BEFORE the draft flips public. The checks live in the kit's
    # scripts/verify-release.mjs (unit-tested, see its header for the list):
    # the asset list must equal what `targets` x the *_bundles inputs produce
    # (missing AND unexpected names fail), every asset must be non-empty with a
    # GitHub sha256 digest, and the updater manifest must cover exactly the
    # shipped platforms with URLs on the serving repo's tag path and signatures
    # byte-identical to the uploaded .sig files, made by the app's own pubkey.
    needs: [check-changelog, plan, create-release, build-and-release, create-updater-json, checksums, cosign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    # Read-only in intent, but in same-repo mode it reads a DRAFT release, and
    # the REST API lists drafts only to tokens with push access.
    permissions:
      contents: write
    if: ${{ !cancelled() && needs.build-and-release.result == 'success' && needs.create-updater-json.result == 'success' && needs.checksums.result == 'success' && (needs.cosign.result == 'success' || needs.cosign.result == 'skipped') }}
    steps:
      # The app's tauri.conf.json + per-OS overlays name the assets
      # (productName, rpm release, WiX languages) and carry the updater pubkey.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check-changelog.outputs.sha }}
          path: app

      # The verification script, from the kit commit the caller pinned — not
      # from `main`, so a consumer pinned to a SHA runs the checks of that SHA.
      - name: Check out the kit's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false

      # If job.workflow_* ever resolved empty, checkout would quietly fetch the
      # APP repo into .release-kit; fail on that here instead of on an import.
      - name: Confirm the kit checkout
        run: |
          test -f .release-kit/scripts/verify-release.mjs \
            || { echo "::error::The kit checkout did not resolve (job.workflow_repository/job.workflow_sha) — no scripts/verify-release.mjs"; exit 1; }

      # Pre-publish verification must go through the API: draft-release assets
      # are NOT downloadable via their public URLs. Public reachability is
      # smoke-tested post-publish in publish-release. A failing result is
      # re-read up to 8 times, 5 s apart (GitHub computes digests
      # asynchronously), and the step summary is written either way.
      # releases_repo token via the GitHub App (see create-release).
      - name: Mint releases-repo token (GitHub App)
        id: app_token
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repositories: ${{ needs.check-changelog.outputs.releases_name }}
          permission-contents: write

      - name: Verify release assets + update manifest (via API)
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          CHANNEL: ${{ needs.create-release.outputs.channel }}
          TAG: ${{ needs.create-release.outputs.version }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          REL_NAME: ${{ needs.check-changelog.outputs.releases_name }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          MACOS_BUNDLES: ${{ needs.plan.outputs.macos_bundles }}
          WINDOWS_BUNDLES: ${{ needs.plan.outputs.windows_bundles }}
          LINUX_BUNDLES: ${{ needs.plan.outputs.linux_bundles }}
          SRC_TAURI: app/${{ inputs.project_path }}/src-tauri
          SUMS_SIGNED: ${{ needs.checksums.outputs.signed }}
          COSIGN_SIGNED: ${{ needs.cosign.result == 'success' }}
        with:
          github-token: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { pathToFileURL } = require('node:url');
            const { run } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.release-kit/scripts/verify-release.mjs`).href);
            await run({ github, core, env: process.env });

      # The script writes the full table itself; this only covers a run that
      # died before it could (checkout failure, script crash).
      - name: Summary (verification did not complete)
        if: ${{ !cancelled() && steps.verify.outputs.summary_written != 'true' }}
        env:
          TAG: ${{ needs.create-release.outputs.version }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## Release verification: ${TAG}"
            echo
            echo "Verification did not run to completion (verify step: ${OUTCOME:-not reached}). See the job log."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: [check-changelog, create-release, build-and-release, create-updater-json, verify-release, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Flips the draft public and maintains the rolling latest-<channel> release.
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    # attest never fails the release on its own (continue-on-error on the
    # attest step); it still has to have run, so provenance precedes publish.
    if: ${{ !cancelled() && needs.build-and-release.result == 'success' && needs.create-updater-json.result == 'success' && needs.verify-release.result == 'success' && needs.attest.result == 'success' }}
    steps:
      # releases_repo token via the GitHub App (see create-release).
      - name: Mint releases-repo token (GitHub App)
        id: app_token
        if: inputs.app_client_id != '' && inputs.releases_repo != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ needs.check-changelog.outputs.releases_owner }}
          repositories: ${{ needs.check-changelog.outputs.releases_name }}
          permission-contents: write

      - name: Publish release
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          REL_NAME: ${{ needs.check-changelog.outputs.releases_name }}
          CHANNEL: ${{ needs.create-release.outputs.channel }}
          VERSION: ${{ needs.check-changelog.outputs.version }}
        with:
          github-token: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = process.env.REL_OWNER;
            const repo = process.env.REL_NAME;
            const channel = process.env.CHANNEL;
            // Re-read right before the flip: verify-release proved THIS draft, and
            // anything that published or re-drafted it since (a manual click, a
            // concurrent run) means what goes public is no longer what was verified.
            const { data: current } = await github.rest.repos.getRelease({ owner, repo, release_id: Number(process.env.RELEASE_ID) });
            if (current.draft !== true) {
              core.setFailed(`Release ${current.tag_name} on ${owner}/${repo} is no longer a draft — it was published outside this run after verification; not touching it.`);
              return;
            }
            // `releases/latest` is what every stable updater polls, and GitHub's
            // default for make_latest is "the release published most recently" —
            // not the highest version. A hotfix on an older line published after a
            // newer minor would capture it and offer every client a downgrade. Only
            // a stable release that is at least the current latest may take it.
            const parse = (v) => {
              const m = /^v?(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/.exec(v);
              return m ? [Number(m[1]), Number(m[2]), Number(m[3]), m[4] ?? null] : null;
            };
            // semver §11 precedence: identifier by identifier, numeric ones by value,
            // so alpha.10 ranks above alpha.9 and a bare alpha below alpha.1.
            const compare = (a, b) => {
              for (let i = 0; i < 3; i += 1) if (a[i] !== b[i]) return a[i] - b[i];
              if (a[3] === null && b[3] === null) return 0;
              if (a[3] === null) return 1;
              if (b[3] === null) return -1;
              const x = a[3].split('.'), y = b[3].split('.');
              for (let i = 0; i < Math.max(x.length, y.length); i += 1) {
                if (x[i] === undefined) return -1;
                if (y[i] === undefined) return 1;
                if (x[i] === y[i]) continue;
                const nx = /^\d+$/.test(x[i]), ny = /^\d+$/.test(y[i]);
                if (nx && ny) return Number(x[i]) - Number(y[i]);
                if (nx !== ny) return nx ? -1 : 1;
                return x[i] < y[i] ? -1 : 1;
              }
              return 0;
            };
            let makeLatest = 'false';
            if (channel === 'stable') {
              makeLatest = 'true';
              try {
                const { data: current } = await github.rest.repos.getLatestRelease({ owner, repo });
                const mine = parse(process.env.VERSION);
                const theirs = parse(current.tag_name);
                if (mine && theirs && compare(mine, theirs) < 0) {
                  makeLatest = 'false';
                  core.warning(`${process.env.VERSION} is below the current latest ${current.tag_name}; publishing without taking releases/latest`);
                }
              } catch (error) {
                if (error.status !== 404) throw error; // no latest yet: this one is it
              }
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: makeLatest,
            })

      # Post-publish smoke test: now that the release is public, the manifest
      # and every platform URL must resolve for an UNAUTHENTICATED client —
      # exactly what end users' updaters are. This can only pass when the
      # releases repo is PUBLIC (see the header note).
      - name: Smoke-test public URLs
        id: public_urls
        env:
          CHANNEL: ${{ needs.create-release.outputs.channel }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          REL_NAME: ${{ needs.check-changelog.outputs.releases_name }}
        run: |
          set -euo pipefail
          MANIFEST_NAME=$([ "$CHANNEL" = "stable" ] && echo latest.json || echo "latest-${CHANNEL}.json")
          URL="https://github.com/${REL_OWNER}/${REL_NAME}/releases/download/${VERSION}/${MANIFEST_NAME}"
          for _ in 1 2 3; do
            CODE=$(curl -s -o /tmp/manifest.json -w '%{http_code}' -L -A release-verify "$URL") && [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::Manifest not publicly reachable: HTTP $CODE $URL"; exit 1; }
          FAIL=0
          for u in $(python3 -c "import json;[print(p['url']) for p in json.load(open('/tmp/manifest.json'))['platforms'].values()]"); do
            C=$(curl -s -o /dev/null -w '%{http_code}' -I -L -A release-verify "$u")
            echo "HTTP $C  $u"
            [ "$C" = "200" ] || FAIL=1
          done
          [ "$FAIL" = "0" ] || { echo "::error::One or more platform URLs are not publicly reachable"; exit 1; }

      # alpha/beta poll a fixed rolling release (latest-<channel>); this step
      # maintains it. Runs after the draft flip so the manifest never points at
      # draft-only (404) asset URLs.
      - name: Mirror channel manifest to rolling release
        id: mirror
        if: needs.create-release.outputs.channel != 'stable'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          CHANNEL: ${{ needs.create-release.outputs.channel }}
          APP_NAME: ${{ inputs.app_display_name }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          REL_NAME: ${{ needs.check-changelog.outputs.releases_name }}
        with:
          github-token: ${{ steps.app_token.outputs.token || inputs.releases_repo != '' && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            const channel = process.env.CHANNEL;
            const appName = process.env.APP_NAME;
            const owner = process.env.REL_OWNER;
            const repo = process.env.REL_NAME;
            const manifestName = `latest-${channel}.json`;

            const { data: versioned } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            const manifestAsset = versioned.assets.find((a) => a.name === manifestName);
            if (!manifestAsset) { core.setFailed(`Versioned release missing ${manifestName}`); return; }
            const download = await github.rest.repos.getReleaseAsset({
              owner, repo, asset_id: manifestAsset.id, headers: { accept: 'application/octet-stream' },
            });

            const rollingTag = `latest-${channel}`;
            let rolling;
            try {
              rolling = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: rollingTag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              rolling = (await github.rest.repos.createRelease({
                owner, repo, tag_name: rollingTag,
                name: `${appName} ${channel} channel`,
                body: `Rolling release backing the ${channel} auto-update channel. Its latest.json is replaced by every ${channel} release — do not edit or delete.`,
                prerelease: true,
              })).data;
            }
            // The rolling pointer is what every client on this channel polls, so it
            // may only move forward: a retried or late-dispatched older prerelease
            // must not replace a newer one and offer everyone above it a downgrade.
            const stale = rolling.assets.find((a) => a.name === 'latest.json');
            const mine = JSON.parse(Buffer.from(download.data).toString('utf8')).version;
            if (stale) {
              const existing = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: stale.id, headers: { accept: 'application/octet-stream' },
              });
              const theirs = JSON.parse(Buffer.from(existing.data).toString('utf8')).version;
              const parse = (v) => {
                const m = /^v?(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/.exec(v);
                return m ? [Number(m[1]), Number(m[2]), Number(m[3]), m[4] ?? null] : null;
              };
              // semver §11 precedence, as in publish-release above: alpha.10 ranks
              // above alpha.9, which a string comparison gets backwards.
              const compare = (a, b) => {
                for (let i = 0; i < 3; i += 1) if (a[i] !== b[i]) return a[i] - b[i];
                if (a[3] === null && b[3] === null) return 0;
                if (a[3] === null) return 1;
                if (b[3] === null) return -1;
                const x = a[3].split('.'), y = b[3].split('.');
                for (let i = 0; i < Math.max(x.length, y.length); i += 1) {
                  if (x[i] === undefined) return -1;
                  if (y[i] === undefined) return 1;
                  if (x[i] === y[i]) continue;
                  const nx = /^\d+$/.test(x[i]), ny = /^\d+$/.test(y[i]);
                  if (nx && ny) return Number(x[i]) - Number(y[i]);
                  if (nx !== ny) return nx ? -1 : 1;
                  return x[i] < y[i] ? -1 : 1;
                }
                return 0;
              };
              const a = parse(mine);
              const b = parse(theirs);
              if (a && b && compare(a, b) < 0) {
                core.warning(`${rollingTag}/latest.json already points at ${theirs}, newer than ${mine}; leaving it`);
                return;
              }
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: stale.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: rolling.id, name: 'latest.json', data: Buffer.from(download.data),
            });
            console.log(`Mirrored ${manifestName} to ${rollingTag}/latest.json`);

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          CHANNEL: ${{ needs.create-release.outputs.channel }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          REL_NAME: ${{ needs.check-changelog.outputs.releases_name }}
          PUBLISH: ${{ steps.publish.outcome }}
          PUBLIC_URLS: ${{ steps.public_urls.outcome }}
          MIRROR: ${{ steps.mirror.outcome }}
        run: |
          {
            echo "## Publish: ${VERSION} (${CHANNEL})"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Draft flipped to published | ${PUBLISH:-not reached} |"
            echo "| Manifest + platform URLs reachable anonymously | ${PUBLIC_URLS:-not reached} |"
            echo "| Rolling latest-${CHANNEL} manifest updated | ${MIRROR:-not reached} |"
            echo
            echo "Release: https://github.com/${REL_OWNER}/${REL_NAME}/releases/tag/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Publish/refresh a Homebrew cask once the release is live. Stable releases
  # own "<product_name>"; alpha/beta own channel-suffixed "<product_name>@alpha"
  # / "@beta", so testers opt in explicitly and stable users are never offered
  # a prerelease. Skips with a warning when homebrew_tap / product_name /
  # HOMEBREW_TAP_TOKEN are not configured.
  publish-homebrew-cask:
    needs: [check-changelog, create-release, publish-release, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    # Pushes with HOMEBREW_TAP_TOKEN (or the GitHub App); GITHUB_TOKEN only
    # reads the published release's asset list.
    permissions:
      contents: read
    if: ${{ !cancelled() && needs.publish-release.result == 'success' && inputs.homebrew_tap != '' }}
    steps:
      - name: Resolve tap
        id: tap
        env:
          TAP_REPO: ${{ inputs.homebrew_tap }}
        run: |
          { echo "owner=${TAP_REPO%%/*}"; echo "name=${TAP_REPO##*/}"; } >> "$GITHUB_OUTPUT"

      # With app_client_id the App replaces HOMEBREW_TAP_TOKEN; it must be
      # installed on the tap (a mint failure here is a misconfiguration).
      - name: Mint tap token (GitHub App)
        id: app_token
        if: inputs.app_client_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.tap.outputs.owner }}
          repositories: ${{ steps.tap.outputs.name }}
          permission-contents: write

      - name: Check cask prerequisites
        id: prereq
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app_token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          MACOS_BUNDLES: ${{ needs.plan.outputs.macos_bundles }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither HOMEBREW_TAP_TOKEN nor app_client_id set — skipping Homebrew cask publish"
            exit 0
          fi
          if [ -z "${PRODUCT_NAME:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::product_name input not set — skipping Homebrew cask publish"
            exit 0
          fi
          case ",$TARGETS," in
            *",darwin-aarch64,"*|*",darwin-x86_64,"*) ;;
            *)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::warning::No macOS targets in this app's target set — skipping Homebrew cask publish"
              exit 0
              ;;
          esac
          # A cask installs a DMG. Without one there is nothing to point it at.
          case ",$MACOS_BUNDLES," in
            *",dmg,"*) ;;
            *)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::warning::'dmg' is not in macos_bundles — skipping Homebrew cask publish (a cask needs a .dmg to install)"
              exit 0
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Generate and push cask
        if: steps.prereq.outputs.ready == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app_token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
          CHANNEL: ${{ needs.create-release.outputs.channel }}
          APP_NAME: ${{ inputs.app_display_name }}
          PRODUCT: ${{ inputs.product_name }}
          TAP_REPO: ${{ inputs.homebrew_tap }}
          CASK_DESC: ${{ inputs.cask_desc }}
          CASK_HOMEPAGE: ${{ inputs.cask_homepage }}
          BUNDLE_ID: ${{ inputs.bundle_identifier }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          REL_NAME: ${{ needs.check-changelog.outputs.releases_name }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -euo pipefail
          BARE="${VERSION#v}"
          BASE_URL="https://github.com/${REL_OWNER}/${REL_NAME}/releases/download/${VERSION}"
          # GitHub renames special characters in asset names ("My App_1.0.0_x64.dmg"
          # is served as "My.App_1.0.0_x64.dmg"), so a URL built from productName
          # 404s for any name with a space. Look the DMG up instead: tauri-action
          # uploads it with the original name as its label.
          gh api "repos/${REL_OWNER}/${REL_NAME}/releases/tags/${VERSION}" > "${RUNNER_TEMP}/release.json"
          dmg_asset() {
            local uploaded="${PRODUCT}_${BARE}_$1.dmg" stored
            stored="$(jq -r --arg n "$uploaded" '[.assets[] | select((.label // "") == $n or .name == $n) | .name][0] // empty' "${RUNNER_TEMP}/release.json")"
            if [ -z "$stored" ]; then
              echo "::error::No asset uploaded as ${uploaded} on ${REL_OWNER}/${REL_NAME}@${VERSION} (DMGs there: $(jq -r '[.assets[].name | select(endswith(".dmg"))] | join(", ")' "${RUNNER_TEMP}/release.json")). Does product_name equal tauri.conf.json productName?" >&2
              return 1
            fi
            printf '%s' "$stored"
          }
          # The cask's url interpolates #{version}; the stored name and the tag
          # carry the version literally.
          V='#{version}'
          TAG_T="${VERSION//${BARE}/${V}}"

          # The cask only references DMGs for the mac arches the app actually
          # ships (plan's `targets`); prereq already guaranteed at least one.
          HAS_ARM=false; HAS_X64=false
          case ",$TARGETS," in *",darwin-aarch64,"*) HAS_ARM=true;; esac
          case ",$TARGETS," in *",darwin-x86_64,"*) HAS_X64=true;; esac

          # Hash the published macOS DMGs (public assets — no auth needed) and
          # render one on_* block per shipped arch. A single-arch app also gets
          # a `depends_on arch:` guard — a cask with no block for the
          # visitor's arch fails at install time with a confusing error.
          ARM_BLOCK=""
          INTEL_BLOCK=""
          if [ "$HAS_ARM" = true ]; then
            DMG_ARM="$(dmg_asset aarch64)"
            curl -fsSL -o arm64.dmg "${BASE_URL}/${DMG_ARM}"
            SHA_ARM="$(sha256sum arm64.dmg | cut -d' ' -f1)"
            URL_ARM="https://github.com/${REL_OWNER}/${REL_NAME}/releases/download/${TAG_T}/${DMG_ARM//_${BARE}_/_${V}_}"
            ARM_BLOCK="$(cat <<ARM

            on_arm do
              sha256 "${SHA_ARM}"
              url "${URL_ARM}"
            end
          ARM
          )"
          fi
          if [ "$HAS_X64" = true ]; then
            DMG_X64="$(dmg_asset x64)"
            curl -fsSL -o x64.dmg "${BASE_URL}/${DMG_X64}"
            SHA_X64="$(sha256sum x64.dmg | cut -d' ' -f1)"
            URL_X64="https://github.com/${REL_OWNER}/${REL_NAME}/releases/download/${TAG_T}/${DMG_X64//_${BARE}_/_${V}_}"
            INTEL_BLOCK="$(cat <<INTEL

            on_intel do
              sha256 "${SHA_X64}"
              url "${URL_X64}"
            end
          INTEL
          )"
          fi
          ARCH_DEP_LINE=""
          if [ "$HAS_ARM" != "$HAS_X64" ]; then
            if [ "$HAS_ARM" = true ]; then ARCH_ONLY=":arm64"; else ARCH_ONLY=":x86_64"; fi
            ARCH_DEP_LINE="$(printf '\n  depends_on arch: %s' "$ARCH_ONLY")"
          fi

          # Cask tokens are lowercase by Homebrew convention; PRODUCT keeps its
          # original case for asset URLs (the DMG filename stem is case-sensitive).
          TOKEN_BASE="$(printf '%s' "$PRODUCT" | tr '[:upper:]' '[:lower:]')"
          if [ "$CHANNEL" = "stable" ]; then
            CASK_TOKEN="${TOKEN_BASE}"
          else
            CASK_TOKEN="${TOKEN_BASE}@${CHANNEL}"
          fi

          # Optional stanzas rendered ahead of the heredoc.
          ZAP_BLOCK=""
          if [ -n "${BUNDLE_ID:-}" ]; then
            ZAP_BLOCK="$(cat <<ZAP

            zap trash: [
              "~/Library/Application Support/${BUNDLE_ID}",
              "~/Library/Caches/${BUNDLE_ID}",
              "~/Library/Preferences/${BUNDLE_ID}.plist",
              "~/Library/Saved Application State/${BUNDLE_ID}.savedState",
              "~/Library/WebKit/${BUNDLE_ID}",
            ]
          ZAP
          )"
          fi
          CAVEATS_BLOCK=""
          if [ "$CHANNEL" != "stable" ]; then
            CAVEATS_BLOCK="$(cat <<CAV

            caveats <<~EOS
              ${CHANNEL^} builds may not be notarized. If macOS refuses to open
              the app, clear the quarantine flag:
                xattr -dr com.apple.quarantine "/Applications/${PRODUCT}.app"
            EOS
          CAV
          )"
          fi

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks

          # Unquoted heredoc — ${...} is expanded by this shell; Ruby's
          # #{version} interpolation passes through untouched. YAML's block
          # scalar strips this script's base indentation, so the body lands
          # flush-left in the cask file.
          cat > "tap/Casks/${CASK_TOKEN}.rb" <<EOF
          # This file is generated by the tauri-release-kit release workflow. DO NOT EDIT.
          cask "${CASK_TOKEN}" do
            version "${BARE}"${ARM_BLOCK}${INTEL_BLOCK}

            name "${APP_NAME}"
            desc "${CASK_DESC}"
            homepage "${CASK_HOMEPAGE}"

            livecheck do
              skip "Updated by the release workflow."
            end

            # The app ships Tauri's built-in updater, so Homebrew must not
            # downgrade it back to the cask version on \`brew upgrade\`.
            auto_updates true
            # Bare symbol = "this version or newer"; the string comparison form
            # (">= :ventura") is deprecated in Homebrew 4.x and warns on install.
            depends_on macos: :ventura${ARCH_DEP_LINE}

            app "${PRODUCT}.app"${ZAP_BLOCK}${CAVEATS_BLOCK}
          end
          EOF

          cd tap
          if [ -n "${APP_SLUG:-}" ]; then
            # Commit as the App's bot account, so the tap's history links to it.
            BOT_ID="$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "release-kit-bot"
            git config user.email "releases@users.noreply.github.com"
          fi
          git add "Casks/${CASK_TOKEN}.rb"
          if git diff --cached --quiet; then
            echo "Cask unchanged — nothing to push."
            exit 0
          fi
          git commit -m "${PRODUCT}: update ${CASK_TOKEN} to ${BARE}"
          git push origin HEAD
          echo "Published ${CASK_TOKEN} ${BARE} to ${TAP_REPO}"

  # Submit STABLE releases to winget (microsoft/winget-pkgs) through
  # vedantmgoyal9/winget-releaser, which runs komac to open the version PR
  # from the fork. Prereleases never go to winget. Skips with a warning when
  # WINGET_TOKEN is absent; a token that cannot push to its fork fails here in
  # seconds instead of deep inside komac.
  #
  # The package must already exist in winget-pkgs — the first version is
  # submitted by hand once (README, "winget and Scoop"). Note what the action
  # itself pulls at run time: cargo-bins/cargo-binstall@main and the latest
  # komac, neither pinned by the action.
  publish-winget:
    needs: [check-changelog, create-release, publish-release, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    # The action reads the published release with github.token.
    permissions:
      contents: read
    if: ${{ !cancelled() && needs.publish-release.result == 'success' && needs.create-release.outputs.channel == 'stable' && inputs.winget_identifier != '' }}
    steps:
      - name: Check winget prerequisites
        id: prereq
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          FORK_USER: ${{ inputs.winget_fork_user || github.repository_owner }}
          REL_OWNER: ${{ needs.check-changelog.outputs.releases_owner }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          WINDOWS_BUNDLES: ${{ needs.plan.outputs.windows_bundles }}
        run: |
          set -euo pipefail
          skip() { echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::warning::$1 — skipping winget"; exit 0; }
          [ -n "${WINGET_TOKEN:-}" ] || skip "WINGET_TOKEN secret missing"
          X64=false; ARM=false
          case ",$TARGETS," in *",windows-x86_64,"*) X64=true ;; esac
          case ",$TARGETS," in *",windows-aarch64,"*) ARM=true ;; esac
          [ "$X64" = true ] || [ "$ARM" = true ] || skip "no Windows targets in this app's target set"
          # winget-releaser looks the release up under github.repository_owner.
          [ "$REL_OWNER" = "$GITHUB_REPOSITORY_OWNER" ] \
            || skip "the releases repo belongs to ${REL_OWNER}, but winget-releaser only reads releases owned by ${GITHUB_REPOSITORY_OWNER}"
          if ! PUSH="$(GH_TOKEN="$WINGET_TOKEN" gh api "repos/${FORK_USER}/winget-pkgs" --jq '.permissions.push' 2>"${RUNNER_TEMP}/gh.err")"; then
            echo "::error::WINGET_TOKEN cannot read ${FORK_USER}/winget-pkgs: $(head -1 "${RUNNER_TEMP}/gh.err") — fork microsoft/winget-pkgs to that account, or set winget_fork_user"
            exit 1
          fi
          if [ "$PUSH" != true ]; then
            echo "::error::WINGET_TOKEN cannot push to ${FORK_USER}/winget-pkgs — use a PAT (public_repo) of the account that owns the fork, or set winget_fork_user"
            exit 1
          fi
          # The MSI when it ships: komac reads an MSI from its WiX tables, but
          # has to emulate an NSIS script, and skriuw's submissions of tauri
          # NSIS installers aborted in the WebView2 downloadBootstrapper branch
          # ("Failed to install WebView2!") until it switched to the MSI. There
          # is no ARM64 MSI, so arm64 always ships its NSIS installer. The regex
          # reaches pwsh inside single quotes: it must never contain one.
          PARTS=()
          if [ "$X64" = true ]; then
            case ",$WINDOWS_BUNDLES," in
              *",msi,"*) PARTS+=('_x64_[A-Za-z0-9-]+\.msi') ;;
              *) PARTS+=('_x64-setup\.exe') ;;
            esac
          fi
          [ "$ARM" = true ] && PARTS+=('_arm64-setup\.exe')
          REGEX="($(IFS='|'; echo "${PARTS[*]}"))\$"
          {
            echo "ready=true"
            echo "fork_user=${FORK_USER}"
            echo "regex=${REGEX}"
          } >> "$GITHUB_OUTPUT"
          echo "winget installers matching ${REGEX}; fork ${FORK_USER}/winget-pkgs"

      - name: Submit to winget
        if: steps.prereq.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          # No `version`: the action takes it from the tag, minus the leading v.
          identifier: ${{ inputs.winget_identifier }}
          release-repository: ${{ needs.check-changelog.outputs.releases_name }}
          release-tag: ${{ needs.check-changelog.outputs.version }}
          installers-regex: ${{ steps.prereq.outputs.regex }}
          fork-user: ${{ steps.prereq.outputs.fork_user }}
          token: ${{ secrets.WINGET_TOKEN }}

  # Update a Scoop bucket's manifest for STABLE releases: version, and the
  # url + hash of the NSIS installer per shipped architecture (64bit, arm64).
  # The manifest is created once by hand (README, "winget and Scoop") — how
  # the app installs is the bucket owner's decision; this only moves it to the
  # new release. A URL fragment such as `#/dl.7z` in the existing url is kept.
  # The hash is GitHub's sha256 digest of the published asset.
  publish-scoop:
    needs: [check-changelog, create-release, publish-release, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Pushes with SCOOP_TAP_TOKEN or the GitHub App; no GITHUB_TOKEN use.
    permissions: {}
    if: ${{ !cancelled() && needs.publish-release.result == 'success' && needs.create-release.outputs.channel == 'stable' && inputs.scoop_bucket != '' }}
    steps:
      - name: Resolve bucket
        id: bucket
        env:
          BUCKET: ${{ inputs.scoop_bucket }}
        run: |
          { echo "owner=${BUCKET%%/*}"; echo "name=${BUCKET##*/}"; } >> "$GITHUB_OUTPUT"

      # With app_client_id the App replaces SCOOP_TAP_TOKEN and must be
      # installed on the bucket.
      - name: Mint bucket token (GitHub App)
        id: app_token
        if: inputs.app_client_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.bucket.outputs.owner }}
          repositories: ${{ steps.bucket.outputs.name }}
          permission-contents: write

      - name: Update and push the Scoop manifest
        env:
          TOKEN: ${{ steps.app_token.outputs.token || secrets.SCOOP_TAP_TOKEN }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          BUCKET: ${{ inputs.scoop_bucket }}
          PRODUCT: ${{ inputs.product_name }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          VERSION: ${{ needs.check-changelog.outputs.version }}
          REPO: ${{ needs.check-changelog.outputs.releases_owner }}/${{ needs.check-changelog.outputs.releases_name }}
        run: |
          set -euo pipefail
          skip() { echo "::warning::$1 — skipping Scoop"; exit 0; }
          [ -n "${TOKEN:-}" ] || skip "neither SCOOP_TAP_TOKEN nor app_client_id is set"
          [ -n "$PRODUCT" ] || skip "product_name is not set (the manifest is bucket/<product_name lowercased>.json)"
          case ",$TARGETS," in *",windows-"*) ;; *) skip "no Windows targets in this app's target set" ;; esac
          BARE="${VERSION#v}"
          MANIFEST="bucket/$(printf '%s' "$PRODUCT" | tr '[:upper:]' '[:lower:]').json"
          GH_TOKEN="$TOKEN" gh api "repos/${REPO}/releases/tags/${VERSION}" > "${RUNNER_TEMP}/release.json"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${BUCKET}.git" bucket-repo
          cd bucket-repo
          [ -f "$MANIFEST" ] || skip "${BUCKET} has no ${MANIFEST} yet — create it once by hand (README, \"winget and Scoop\")"
          # One NSIS installer per shipped Windows arch; Scoop's architecture keys.
          # shellcheck disable=SC2016 # a jq program: $v is jq's variable, not the shell's
          UPDATE='.version = $v'
          ARGS=(--arg v "$BARE")
          for pair in "windows-x86_64:64bit:x64" "windows-aarch64:arm64:arm64"; do
            IFS=: read -r TARGET KEY ARCH <<<"$pair"
            case ",$TARGETS," in *",${TARGET},"*) ;; *) continue ;; esac
            ASSET="$(jq -r --arg s "_${ARCH}-setup.exe" '[.assets[] | select(.name | endswith($s))][0] // empty | "\(.name) \(.digest)"' "${RUNNER_TEMP}/release.json")"
            NAME="${ASSET%% *}"; DIGEST="${ASSET##* }"
            if [ -z "$NAME" ] || ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
              echo "::error::No *_${ARCH}-setup.exe with a sha256 digest on ${REPO}@${VERSION}"
              exit 1
            fi
            URL="https://github.com/${REPO}/releases/download/${VERSION}/${NAME}"
            ARGS+=(--arg "u_${KEY}" "$URL" --arg "h_${KEY}" "${DIGEST#sha256:}")
            # Keep a fragment the bucket owner added (e.g. #/dl.7z for extraction).
            UPDATE+=" | .architecture[\"${KEY}\"].url = (\$u_${KEY} + ((.architecture[\"${KEY}\"].url // \"\") | capture(\"(?<f>#.*)$\").f // \"\"))"
            UPDATE+=" | .architecture[\"${KEY}\"].hash = \$h_${KEY}"
          done
          jq "${ARGS[@]}" "$UPDATE" "$MANIFEST" > "${MANIFEST}.tmp"
          mv "${MANIFEST}.tmp" "$MANIFEST"
          git diff
          if [ -n "${APP_SLUG:-}" ]; then
            BOT_ID="$(GH_TOKEN="$TOKEN" gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "release-kit-bot"
            git config user.email "releases@users.noreply.github.com"
          fi
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "Scoop manifest already at ${BARE}."
            exit 0
          fi
          git commit -m "$(basename "$MANIFEST" .json): update to ${BARE}"
          git push origin HEAD
          echo "::notice::Updated ${BUCKET}/${MANIFEST} to ${BARE}"

  # Post-release patch bump PR (stable releases only; opt out via
  # post_release_bump when a local driver bumps before tagging). Default
  # GITHUB_TOKEN pushes don't trigger workflows — re-run CI on the PR
  # manually if needed.
  bump-version:
    # After publishing, as the PR body says: a release that failed verification or never
    # flipped public must not open a bump PR for a version nobody can install.
    needs: [create-release, build-and-release, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.publish-release.result == 'success' && needs.create-release.outputs.channel == 'stable' && inputs.post_release_bump
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASED_VERSION: ${{ needs.create-release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_PATH: ${{ inputs.project_path }}
      CARGO_PACKAGE: ${{ inputs.cargo_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Compute next patch version
        id: next
        run: |
          set -euo pipefail
          BARE="${RELEASED_VERSION#v}"
          if ! printf '%s' "$BARE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Released version '$BARE' is not plain semver. Skipping bump."
            exit 1
          fi
          NEXT=$(python3 -c "
          import sys
          parts = sys.argv[1].split('.')
          parts[2] = str(int(parts[2]) + 1)
          print('.'.join(parts))
          " "$BARE")
          {
            echo "BARE=$BARE"
            echo "NEXT=$NEXT"
            echo "BRANCH=chore/bump-version-${NEXT}"
          } >> "$GITHUB_OUTPUT"

      - name: Update version files
        env:
          BARE: ${{ steps.next.outputs.BARE }}
          NEXT: ${{ steps.next.outputs.NEXT }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re
          from pathlib import Path

          released = os.environ["BARE"]
          new = os.environ["NEXT"]
          proj = Path(os.environ["PROJECT_PATH"])
          pkg = os.environ["CARGO_PACKAGE"]

          json_targets = [
              Path("package.json"),
              proj / "package.json",
              proj / "src-tauri" / "tauri.conf.json",
              proj / "src-tauri" / "tauri.macos.conf.json",
              proj / "src-tauri" / "tauri.windows.conf.json",
              proj / "src-tauri" / "tauri.linux.conf.json",
          ]
          seen = set()
          for path in json_targets:
              key = path.resolve()
              if key in seen or not path.exists():
                  continue
              seen.add(key)
              text = path.read_text()
              ends_nl = text.endswith("\n")
              data = json.loads(text)
              if data.get("version") == released:
                  data["version"] = new
                  out = json.dumps(data, indent=2) + ("\n" if ends_nl else "")
                  path.write_text(out)
                  print(f"updated {path}")

          cargo_toml = proj / "src-tauri" / "Cargo.toml"
          if cargo_toml.exists():
              text = cargo_toml.read_text()
              new_text, n = re.subn(r'(?m)^version\s*=\s*"' + re.escape(released) + r'"', f'version = "{new}"', text, count=1)
              if n: cargo_toml.write_text(new_text); print("updated Cargo.toml")

          # src-tauri owns the lock when it is its own workspace root;
          # repo-root workspaces keep the lock at the repo root.
          cargo_lock = proj / "src-tauri" / "Cargo.lock"
          if not cargo_lock.exists():
              cargo_lock = Path("Cargo.lock")
          if cargo_lock.exists():
              text = cargo_lock.read_text()
              pat = re.compile(r'(\[\[package\]\]\nname = "' + re.escape(pkg) + r'"\nversion = ")[^"]+(")')
              new_text, n = pat.subn(lambda m: m.group(1) + new + m.group(2), text, count=1)
              if n: cargo_lock.write_text(new_text); print("updated Cargo.lock")
          PY

      - name: Commit and open PR
        env:
          NEXT: ${{ steps.next.outputs.NEXT }}
          BRANCH: ${{ steps.next.outputs.BRANCH }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::warning::Version files already at next patch; nothing to bump."
            exit 0
          fi
          # The checkout does not persist its token (persist-credentials: false), so
          # the remote is given one here: this is the job's last step and the only
          # one that talks to origin.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A dispatch retry of the same tag reaches here a second time; pushing the
          # branch again is a non-fast-forward that fails the whole release job and
          # skips every downstream channel of a release that did publish.
          if [ -n "$(git ls-remote --heads origin "$BRANCH")" ]; then
            echo "::warning::Branch ${BRANCH} already exists on origin — the bump PR was opened by an earlier run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: bump version to ${NEXT}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: bump version to ${NEXT}" \
            --body "Automated post-release bump after publishing \`${RELEASED_VERSION}\`." \
            --base "$BASE_BRANCH" \
            --head "$BRANCH"
