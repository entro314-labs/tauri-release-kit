# Reusable App Store submission workflow: builds a Mac App Store `.pkg` and/or
# an iOS `.ipa` and uploads them to App Store Connect.
#
# This is deliberately SEPARATE from release.yml. App Store builds are a
# different artifact with different signing (Apple Distribution / 3rd Party Mac
# Developer, not Developer ID), different entitlements (App Sandbox), an
# embedded provisioning profile, and no Tauri updater — an app cannot
# self-update inside the App Store sandbox. Mixing the two into one bundle
# config is how apps end up shipping a sandboxed build to direct downloaders,
# or a Developer ID build to App Store review (which rejects it).
#
# What the calling repo must provide (see docs/APP_STORE.md and the files in
# templates/):
#   - src-tauri/tauri.appstore.conf.json — App Store overlay (category,
#     entitlements, no updater)
#   - src-tauri/Entitlements.plist       — App Sandbox + application-identifier
#   - src-tauri/Info.plist               — ITSAppUsesNonExemptEncryption
#   - a registered app in App Store Connect whose Bundle ID matches
#     tauri.conf.json > identifier
#
# GRACEFUL DEGRADATION: every credential is optional. A platform whose
# credentials are absent is SKIPPED with a warning and the workflow still
# succeeds, so a repo can wire the iOS half months after the macOS half.
# Set `strict: true` to turn those skips into failures once you rely on them.

name: App Store (reusable)

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Path to the Tauri app package (contains src-tauri/)'
        required: false
        type: string
        default: '.'
      product_name:
        description: >-
          tauri.conf.json productName — the .app bundle stem, and therefore the
          name of the .pkg this workflow signs and uploads. Required for macOS.
        required: false
        type: string
        default: ''
      macos:
        description: 'Build + upload the Mac App Store package'
        required: false
        type: boolean
        default: true
      ios:
        description: 'Build + upload the iOS app'
        required: false
        type: boolean
        default: false
      macos_target:
        description: >-
          Rust target for the macOS build. `universal-apple-darwin` (default)
          ships one binary for both architectures. Use `aarch64-apple-darwin`
          for an Apple-Silicon-only app — which also requires
          bundle.macOS.minimumSystemVersion >= 12.0.
        required: false
        type: string
        default: 'universal-apple-darwin'
      appstore_config:
        description: >-
          App Store bundle-config overlay, relative to project_path. Merged
          after tauri.conf.json so App Store-only settings (entitlements,
          embedded profile, updater off) never leak into direct downloads.
        required: false
        type: string
        default: 'src-tauri/tauri.appstore.conf.json'
      validate_only:
        description: >-
          Run altool --validate-app and stop before uploading. The honest way
          to test this pipeline: validation runs Apple's full submission
          checks without burning a build number or creating a TestFlight entry.
        required: false
        type: boolean
        default: false
      strict:
        description: 'Turn "credentials missing, skipping" warnings into failures'
        required: false
        type: boolean
        default: false
      node_version:
        required: false
        type: string
        default: '24'
    secrets:
      # --- App Store Connect API key: the only auth altool accepts, and what
      #     Xcode automatic signing uses for iOS. Required for any upload. ---
      APPLE_API_ISSUER:
        description: 'App Store Connect API Issuer ID (UUID)'
        required: false
      APPLE_API_KEY_ID:
        description: 'App Store Connect API Key ID — the .p8 must be named AuthKey_<KEY_ID>.p8, which this workflow does for you'
        required: false
      APPLE_API_KEY_BASE64:
        description: 'base64 of the AuthKey_<KEY_ID>.p8 private key (downloadable exactly once)'
        required: false
      # --- macOS: two certificates. The application one signs the .app, the
      #     INSTALLER one signs the .pkg. They are different certificate types
      #     and productbuild rejects the wrong one. ---
      APPLE_CERTIFICATE:
        description: 'base64 .p12 of the Apple Distribution (or 3rd Party Mac Developer Application) certificate'
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'Overrides identity auto-detection for the .app signature'
        required: false
      APPLE_INSTALLER_CERTIFICATE:
        description: 'base64 .p12 of the 3rd Party Mac Developer Installer (Mac Installer Distribution) certificate'
        required: false
      APPLE_INSTALLER_CERTIFICATE_PASSWORD:
        required: false
      APPLE_INSTALLER_SIGNING_IDENTITY:
        description: 'Overrides identity auto-detection for the .pkg signature'
        required: false
      APPLE_PROVISIONING_PROFILE:
        description: 'base64 of the "Mac App Store Connect" .provisionprofile, embedded into the .app'
        required: false
      KEYCHAIN_PASSWORD:
        description: 'Password for the throwaway build keychain. A random one is generated when unset.'
        required: false
      # --- iOS: Tauri imports these itself. Omit for Xcode automatic signing,
      #     which uses the API key above. ---
      IOS_CERTIFICATE:
        description: 'base64 .p12 of the Apple Distribution certificate (manual iOS signing)'
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_MOBILE_PROVISION:
        description: 'base64 of the "App Store Connect" .mobileprovision (manual iOS signing)'
        required: false

jobs:
  macos:
    if: inputs.macos
    runs-on: macos-15
    steps:
      # Fail (or skip) before the ~15 minutes of universal-binary compilation,
      # not after.
      - name: Check credentials
        id: prereq
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          STRICT: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${APPLE_API_ISSUER:-}" ]            || MISSING="$MISSING APPLE_API_ISSUER"
          [ -n "${APPLE_API_KEY_ID:-}" ]            || MISSING="$MISSING APPLE_API_KEY_ID"
          [ -n "${APPLE_API_KEY_BASE64:-}" ]        || MISSING="$MISSING APPLE_API_KEY_BASE64"
          [ -n "${APPLE_CERTIFICATE:-}" ]           || MISSING="$MISSING APPLE_CERTIFICATE"
          [ -n "${APPLE_INSTALLER_CERTIFICATE:-}" ] || MISSING="$MISSING APPLE_INSTALLER_CERTIFICATE"
          [ -n "${PRODUCT_NAME:-}" ]                || MISSING="$MISSING product_name(input)"
          if [ -n "$MISSING" ]; then
            if [ "$STRICT" = "true" ]; then
              echo "::error::Mac App Store submission is missing:${MISSING}"
              exit 1
            fi
            echo "::warning::Skipping Mac App Store submission — missing:${MISSING}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.prereq.outputs.ready == 'true'

      - name: Install pnpm
        if: steps.prereq.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      # A universal binary needs BOTH Apple targets installed, whichever
      # architecture the runner happens to be.
      - name: Setup Rust
        if: steps.prereq.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust workspace
        if: steps.prereq.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project_path }}/src-tauri
          shared-key: appstore-${{ inputs.macos_target }}
          cache-on-failure: true

      - name: Install dependencies
        if: steps.prereq.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Both certificates go into ONE throwaway keychain that is made default
      # for the job, so `codesign` (via tauri) and `productbuild` (below) both
      # find their identity without either tool creating its own keychain.
      #
      # set-key-partition-list is the step people omit and then spend an hour
      # on: without it macOS puts up a "codesign wants to use key" GUI prompt
      # that a runner can never answer, and the build hangs until timeout.
      - name: Import signing certificates
        id: keychain
        if: steps.prereq.outputs.ready == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KC_PASS="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 24)}"
          KEYCHAIN="${RUNNER_TEMP}/app-store.keychain-db"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          # Keep the login keychain in the search list; the runner's Apple
          # intermediate certificates live there and codesign needs them to
          # build a chain.
          # shellcheck disable=SC2046 # word splitting is the point: one arg per keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          import_p12() {
            local b64="$1" pass="$2" label="$3" tool="$4"
            local file="${RUNNER_TEMP}/${label}.p12"
            if ! printf '%s' "$b64" | base64 --decode > "$file" 2>/dev/null; then
              echo "::error::${label} certificate secret is not valid base64 (produce it with: openssl base64 -A -in cert.p12 -out cert.txt)"
              exit 1
            fi
            security import "$file" -k "$KEYCHAIN" -P "$pass" -T /usr/bin/codesign -T "$tool" \
              || { echo "::error::Failed to import the ${label} certificate — wrong password, or the .p12 has no private key"; exit 1; }
            rm -f "$file"
          }
          import_p12 "$APPLE_CERTIFICATE" "${APPLE_CERTIFICATE_PASSWORD:-}" application /usr/bin/productbuild
          import_p12 "$APPLE_INSTALLER_CERTIFICATE" "${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-}" installer /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null

          echo "--- identities in the build keychain ---"
          security find-identity -v "$KEYCHAIN"

          # App bundle identity: an Apple Distribution or 3rd Party Mac
          # Developer Application certificate. A Developer ID Application cert
          # here is the classic mistake — it builds fine and App Store review
          # rejects it.
          APP_ID="${APPLE_SIGNING_IDENTITY:-}"
          if [ -z "$APP_ID" ]; then
            APP_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep -E '"(Apple Distribution|3rd Party Mac Developer Application)' \
              | head -1 | sed -E 's/.*"(.*)"/\1/' || true)
          fi
          INSTALLER_ID="${APPLE_INSTALLER_SIGNING_IDENTITY:-}"
          if [ -z "$INSTALLER_ID" ]; then
            INSTALLER_ID=$(security find-identity -v "$KEYCHAIN" \
              | grep -E '"(3rd Party Mac Developer Installer|Apple Distribution Installer|Mac Installer Distribution)' \
              | head -1 | sed -E 's/.*"(.*)"/\1/' || true)
          fi
          if [ -z "$APP_ID" ]; then
            echo "::error::No Apple Distribution / 3rd Party Mac Developer Application identity found in the imported certificates. A 'Developer ID Application' certificate signs direct downloads, NOT App Store builds."
            exit 1
          fi
          if [ -z "$INSTALLER_ID" ]; then
            echo "::error::No installer identity found. The .pkg must be signed with a '3rd Party Mac Developer Installer' (Mac Installer Distribution) certificate — the application certificate cannot sign a package."
            exit 1
          fi
          echo "app_identity=${APP_ID}" >> "$GITHUB_OUTPUT"
          echo "installer_identity=${INSTALLER_ID}" >> "$GITHUB_OUTPUT"
          echo "Signing .app with: ${APP_ID}"
          echo "Signing .pkg with: ${INSTALLER_ID}"

      # The provisioning profile is embedded into the bundle as
      # Contents/embedded.provisionprofile via bundle.macOS.files. Apple
      # rejects an App Store submission without it.
      - name: Materialize provisioning profile
        id: profile
        if: steps.prereq.outputs.ready == 'true'
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          SRC_TAURI: ${{ inputs.project_path }}/src-tauri
        run: |
          set -euo pipefail
          if [ -z "${APPLE_PROVISIONING_PROFILE:-}" ]; then
            echo "::warning::APPLE_PROVISIONING_PROFILE unset — the .app will carry no embedded.provisionprofile. App Store Connect will reject the upload unless your appstore config embeds one itself."
            echo "config_arg=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "${SRC_TAURI}/embedded.provisionprofile"
          # Paths in bundle.macOS.files are relative to tauri.conf.json, which
          # lives in src-tauri — so both sides of this mapping are bare names.
          cat > "${SRC_TAURI}/.release-kit.profile.conf.json" <<'JSON'
          {
            "bundle": {
              "macOS": {
                "files": {
                  "embedded.provisionprofile": "embedded.provisionprofile"
                }
              }
            }
          }
          JSON
          echo "config_arg=--config src-tauri/.release-kit.profile.conf.json" >> "$GITHUB_OUTPUT"
          echo "Embedded provisioning profile staged."

      # `build --no-bundle` then `bundle --bundles app` is the documented
      # split: it lets the App Store config apply to bundling only, so the
      # compiled binary is shared with any other bundle flavor in the same run.
      - name: Build the App Store app bundle
        if: steps.prereq.outputs.ready == 'true'
        working-directory: ${{ inputs.project_path }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.keychain.outputs.app_identity }}
          APPSTORE_CONFIG: ${{ inputs.appstore_config }}
          PROFILE_CONFIG: ${{ steps.profile.outputs.config_arg }}
          TARGET: ${{ inputs.macos_target }}
        run: |
          set -euo pipefail
          if [ ! -f "$APPSTORE_CONFIG" ]; then
            echo "::error::App Store config '${APPSTORE_CONFIG}' not found under ${PWD}. Copy templates/tauri.appstore.conf.json into src-tauri/ and adjust it — building without it submits a non-sandboxed, updater-enabled bundle that review will reject."
            exit 1
          fi
          pnpm exec tauri build --no-bundle --target "$TARGET"
          # shellcheck disable=SC2086 # PROFILE_CONFIG is an intentional arg pair
          pnpm exec tauri bundle --bundles app --target "$TARGET" \
            --config "$APPSTORE_CONFIG" $PROFILE_CONFIG

      # productbuild wraps the .app in the installer package the App Store
      # accepts. `--component <app> /Applications` is what puts it in the right
      # install location; without the destination the package installs nowhere.
      - name: Package as .pkg
        id: pkg
        if: steps.prereq.outputs.ready == 'true'
        env:
          INSTALLER_IDENTITY: ${{ steps.keychain.outputs.installer_identity }}
          PRODUCT: ${{ inputs.product_name }}
          TARGET: ${{ inputs.macos_target }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="${PROJECT_PATH}/src-tauri/target/${TARGET}/release/bundle/macos"
          APP="${BUNDLE_DIR}/${PRODUCT}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Expected app bundle at ${APP}. Does product_name match tauri.conf.json > productName?"
            ls -la "$BUNDLE_DIR" 2>/dev/null || true
            exit 1
          fi
          # Prove the entitlements actually applied before Apple tells us they
          # didn't: an App Store build MUST be sandboxed. Entitlements are
          # applied at SIGNING time, so an unsigned build has none at all.
          # The output format of `codesign -d --entitlements` has changed
          # across macOS releases, so accept any form that mentions the key.
          ENTITLEMENTS="$( { codesign -d --entitlements - --xml "$APP" 2>/dev/null; \
                            codesign -d --entitlements :- "$APP" 2>/dev/null; } || true )"
          if ! printf '%s' "$ENTITLEMENTS" | grep -q 'com.apple.security.app-sandbox'; then
            echo "::error::${PRODUCT}.app is not sandboxed — bundle.macOS.entitlements must point at an Entitlements.plist containing com.apple.security.app-sandbox. App Store review rejects unsandboxed submissions."
            exit 1
          fi
          PKG="${RUNNER_TEMP}/${PRODUCT}.pkg"
          xcrun productbuild --sign "$INSTALLER_IDENTITY" --component "$APP" /Applications "$PKG"
          pkgutil --check-signature "$PKG"
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"

      # altool authenticates with an API key it looks up BY NAME in a fixed set
      # of directories — the file must be called AuthKey_<KEY_ID>.p8 and live in
      # ./private_keys (or ~/.private_keys, ~/.appstoreconnect/private_keys).
      - name: Stage App Store Connect API key
        if: steps.prereq.outputs.ready == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "${HOME}/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "${HOME}/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          if ! grep -q 'BEGIN PRIVATE KEY' "${HOME}/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"; then
            echo "::error::APPLE_API_KEY_BASE64 did not decode to a PEM private key — base64 the .p8 file itself, not its contents pasted into a text editor"
            exit 1
          fi

      # Validation runs Apple's full submission checks WITHOUT consuming the
      # build number, so it is the honest way to test this pipeline. Upload
      # only follows when validation passes.
      - name: Validate and upload to App Store Connect
        if: steps.prereq.outputs.ready == 'true'
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          set -euo pipefail
          echo "Validating ${PKG}..."
          if ! xcrun altool --validate-app --type macos --file "$PKG" \
              --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER" 2>&1 | tee "${RUNNER_TEMP}/validate.log"; then
            echo "::error::App Store validation failed — see the log above. Nothing was uploaded."
            exit 1
          fi
          if [ "$VALIDATE_ONLY" = "true" ]; then
            echo "::notice::validate_only is set — package validated, upload skipped."
            exit 0
          fi
          xcrun altool --upload-app --type macos --file "$PKG" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "::notice::Uploaded to App Store Connect. Processing takes a few minutes before the build appears in TestFlight."

      # Keep the package even when the upload fails — re-running the whole
      # universal build to retry an upload is pure waste.
      - name: Upload .pkg as a workflow artifact
        if: always() && steps.pkg.outputs.pkg != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-store-pkg
          path: ${{ steps.pkg.outputs.pkg }}
          if-no-files-found: warn
          retention-days: 7

      # A keychain left as the runner's default outlives the job on
      # self-hosted runners and breaks every later build on that machine.
      - name: Remove build keychain
        if: always() && steps.keychain.outcome == 'success'
        run: |
          security default-keychain -s login.keychain-db 2>/dev/null || true
          security delete-keychain "${RUNNER_TEMP}/app-store.keychain-db" 2>/dev/null || true

  ios:
    if: inputs.ios
    runs-on: macos-15
    steps:
      - name: Check credentials
        id: prereq
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          STRICT: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${APPLE_API_ISSUER:-}" ]     || MISSING="$MISSING APPLE_API_ISSUER"
          [ -n "${APPLE_API_KEY_ID:-}" ]     || MISSING="$MISSING APPLE_API_KEY_ID"
          [ -n "${APPLE_API_KEY_BASE64:-}" ] || MISSING="$MISSING APPLE_API_KEY_BASE64"
          [ -n "${PRODUCT_NAME:-}" ]         || MISSING="$MISSING product_name(input)"
          if [ -n "$MISSING" ]; then
            if [ "$STRICT" = "true" ]; then
              echo "::error::iOS submission is missing:${MISSING}"
              exit 1
            fi
            echo "::warning::Skipping iOS submission — missing:${MISSING}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.prereq.outputs.ready == 'true'

      - name: Install pnpm
        if: steps.prereq.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Setup Rust
        if: steps.prereq.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust workspace
        if: steps.prereq.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project_path }}/src-tauri
          shared-key: appstore-ios
          cache-on-failure: true

      - name: Install dependencies
        if: steps.prereq.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Stage App Store Connect API key
        if: steps.prereq.outputs.ready == 'true'
        id: apikey
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.private_keys"
          KEY_PATH="${HOME}/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
            echo "::error::APPLE_API_KEY_BASE64 did not decode to a PEM private key"
            exit 1
          fi
          echo "path=${KEY_PATH}" >> "$GITHUB_OUTPUT"

      # `tauri ios init` is idempotent and generates the Xcode project when
      # src-tauri/gen/apple is not committed (the common case — it is
      # machine-generated and noisy in review).
      - name: Initialize the iOS project
        if: steps.prereq.outputs.ready == 'true'
        working-directory: ${{ inputs.project_path }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ steps.apikey.outputs.path }}
        run: |
          set -euo pipefail
          if [ -d src-tauri/gen/apple ]; then
            echo "Existing Xcode project found — using it as committed."
          else
            pnpm exec tauri ios init --ci
          fi

      # Tauri imports IOS_CERTIFICATE / IOS_MOBILE_PROVISION itself when they
      # are set (manual signing); with only the API key present, Xcode's
      # automatic signing takes over. Both paths are supported — which one runs
      # depends purely on which secrets exist.
      - name: Build the iOS app
        if: steps.prereq.outputs.ready == 'true'
        working-directory: ${{ inputs.project_path }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ steps.apikey.outputs.path }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          set -euo pipefail
          if [ -n "${IOS_CERTIFICATE:-}" ] && [ -z "${IOS_MOBILE_PROVISION:-}" ]; then
            echo "::error::IOS_CERTIFICATE is set but IOS_MOBILE_PROVISION is not — manual iOS signing needs both. Unset both to use Xcode automatic signing with the API key instead."
            exit 1
          fi
          if [ -n "${IOS_CERTIFICATE:-}" ]; then
            echo "Manual iOS signing (IOS_CERTIFICATE + IOS_MOBILE_PROVISION)."
          else
            echo "Xcode automatic signing (App Store Connect API key)."
          fi
          pnpm exec tauri ios build --export-method app-store-connect --ci

      - name: Validate and upload to App Store Connect
        id: upload
        if: steps.prereq.outputs.ready == 'true'
        env:
          PRODUCT: ${{ inputs.product_name }}
          PROJECT_PATH: ${{ inputs.project_path }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          set -euo pipefail
          # Tauri writes the IPA under gen/apple/build/arm64/, but the exact
          # stem follows productName — find it rather than guessing.
          IPA=$(find "${PROJECT_PATH}/src-tauri/gen/apple/build" -name '*.ipa' -print -quit 2>/dev/null || true)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa produced under ${PROJECT_PATH}/src-tauri/gen/apple/build"
            exit 1
          fi
          echo "ipa=${IPA}" >> "$GITHUB_OUTPUT"
          if ! xcrun altool --validate-app --type ios --file "$IPA" \
              --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"; then
            echo "::error::App Store validation failed — nothing was uploaded."
            exit 1
          fi
          if [ "$VALIDATE_ONLY" = "true" ]; then
            echo "::notice::validate_only is set — IPA validated, upload skipped."
            exit 0
          fi
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "::notice::Uploaded to App Store Connect."

      - name: Upload .ipa as a workflow artifact
        if: always() && steps.upload.outputs.ipa != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-store-ipa
          path: ${{ steps.upload.outputs.ipa }}
          if-no-files-found: warn
          retention-days: 7
