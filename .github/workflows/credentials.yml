# Reusable credential preflight: proves the secrets release.yml will use still
# WORK — decrypt, import, authenticate, can push — without building anything.
#
# preflight/ runs the code gates locally; nothing there can see an expired
# Apple certificate, a rotated notarization key, a PFX whose password changed,
# or a lapsed PAT. Those used to surface at the build or publish step of a
# real release, after the paid legs had run (a vanished RELEASES_TOKEN once
# failed a release at publish, after every leg had built). Run this from
# templates/credentials.yml before tagging, or on a schedule.
#
# Rules, the same as release.yml's:
#   - an optional credential that is not configured → ::notice::, not a failure
#   - a credential that is configured but broken, or half-configured → failure
#   - every check runs even after another failed, so one run lists them all
#
# It reads the same secret names and inputs as release.yml, so a caller passes
# `secrets: inherit` and copies the relevant `with:` lines.

name: Credentials (reusable)

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Path to the Tauri app package (contains src-tauri/), as in release.yml'
        required: false
        type: string
        default: '.'
      releases_repo:
        description: "'owner/name' of the releases mirror, as in release.yml. Empty = releases stay on this repo (nothing to check)."
        required: false
        type: string
        default: ''
      homebrew_tap:
        description: "'owner/name' of the Homebrew tap, as in release.yml. Empty = no cask (nothing to check)."
        required: false
        type: string
        default: ''
      windows_azure_endpoint:
        required: false
        type: string
        default: ''
      windows_azure_account:
        required: false
        type: string
        default: ''
      windows_azure_cert_profile:
        required: false
        type: string
        default: ''
      macos_runner:
        description: >-
          Runner for the Apple check (keychain import + notarytool). It only
          runs when Apple secrets are configured; the default hosted image
          bills 10x on private repos for about a minute.
        required: false
        type: string
        default: 'macos-15'
      winget_identifier:
        description: 'As in release.yml. Empty = no winget (nothing to check).'
        required: false
        type: string
        default: ''
      winget_fork_user:
        description: 'As in release.yml. Empty = this repo''s owner.'
        required: false
        type: string
        default: ''
      scoop_bucket:
        description: "'owner/name' of the Scoop bucket, as in release.yml. Empty = no Scoop (nothing to check)."
        required: false
        type: string
        default: ''
      app_client_id:
        description: "The GitHub App release.yml uses instead of the PATs, as in release.yml. Empty = the PATs are checked."
        required: false
        type: string
        default: ''
      environment:
        description: 'The GitHub environment release.yml reads its secrets from, if any'
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      RELEASES_TOKEN:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
      APP_PRIVATE_KEY:
        required: false
      WINGET_TOKEN:
        required: false
      SCOOP_TAP_TOKEN:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      WINDOWS_CERTIFICATE_THUMBPRINT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      LINUX_GPG_PRIVATE_KEY:
        required: false
      LINUX_GPG_PASSPHRASE:
        required: false
      LINUX_GPG_KEY_ID:
        required: false

permissions:
  contents: read

jobs:
  # Everything that runs on Linux, plus the decision whether the macOS and
  # Windows jobs have anything to check (secrets are not readable in a job's
  # `if:`, and a macOS runner is not worth starting to print a notice).
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      apple: ${{ steps.plan.outputs.apple }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      # The app's tauri.conf.json holds the updater pubkey the key must match.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: app

      - name: Check out the kit's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false

      - name: Confirm the kit checkout
        run: |
          test -f .release-kit/scripts/verify-release.mjs \
            || { echo "::error::The kit checkout did not resolve (job.workflow_repository/job.workflow_sha) — no scripts/verify-release.mjs"; exit 1; }

      - name: Decide which OS checks to run
        id: plan
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          APPLE=false; WINDOWS=false
          if [ -n "${APPLE_CERTIFICATE}${APPLE_SIGNING_IDENTITY}${APPLE_API_KEY_BASE64}${APPLE_ID}" ]; then APPLE=true
          else echo "::notice::No Apple signing or notarization secrets — macOS builds ship unsigned; nothing to check."; fi
          if [ -n "${WINDOWS_CERTIFICATE}" ]; then WINDOWS=true; fi
          { echo "apple=${APPLE}"; echo "windows=${WINDOWS}"; } >> "$GITHUB_OUTPUT"

      # Signs a scratch file with the same key and password the build uses:
      # the tauri CLI's `signer sign` decrypts the key exactly as tauri's
      # bundler does (TAURI_SIGNING_PRIVATE_KEY_PASSWORD may be empty — the
      # build passes it through as set). Then the signature's key id must be
      # the one plugins.updater.pubkey names: the CLI only WARNS on a
      # mismatch, and every installed copy then rejects the update.
      # @tauri-apps/cli is pinned here; bump it with your app's CLI.
      - name: Updater signing key
        if: ${{ !cancelled() }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SRC_TAURI: app/${{ inputs.project_path }}/src-tauri
        run: |
          set -euo pipefail
          if [ -z "${TAURI_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — release.yml requires it (createUpdaterArtifacts cannot sign without it)"
            exit 1
          fi
          PROBE="${RUNNER_TEMP}/updater-probe.txt"
          echo "credential preflight" > "$PROBE"
          if ! npx --yes @tauri-apps/cli@2.9.6 signer sign "$PROBE" > "${RUNNER_TEMP}/sign.log" 2>&1; then
            cat "${RUNNER_TEMP}/sign.log"
            echo "::error::TAURI_SIGNING_PRIVATE_KEY could not sign with TAURI_SIGNING_PRIVATE_KEY_PASSWORD (see above) — the build's updater signing would fail the same way"
            exit 1
          fi
          set +e
          RESULT="$(node .release-kit/scripts/verify-release.mjs updater-key "${PROBE}.sig" "$SRC_TAURI")"
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "::notice::Updater key OK: ${RESULT}" ;;
            3) echo "::warning::Updater key decrypts and signs, but ${RESULT} — could not confirm it matches." ;;
            *) echo "::error::Updater key mismatch: ${RESULT}. Installed apps verify updates against plugins.updater.pubkey, so every update would be rejected."; exit 1 ;;
          esac

      # Only when configured: imports the key into a scratch keyring and signs
      # a file with it, the way the Linux legs and the checksums job do.
      - name: Linux GPG key
        if: ${{ !cancelled() }}
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${LINUX_GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::No LINUX_GPG_PRIVATE_KEY — Linux artifacts and SHA256SUMS ship unsigned; nothing to check."
            exit 0
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo 'allow-loopback-pinentry' > "$GNUPGHOME/gpg-agent.conf"
          echo 'pinentry-mode loopback' > "$GNUPGHOME/gpg.conf"
          KEY_FILE="${RUNNER_TEMP}/linux-signing.asc"
          if printf '%s' "$LINUX_GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          elif printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode 2>/dev/null | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          else
            echo "::error::LINUX_GPG_PRIVATE_KEY is neither an ASCII-armored private key nor base64 of one"
            exit 1
          fi
          gpg --batch --yes ${LINUX_GPG_PASSPHRASE:+--passphrase "$LINUX_GPG_PASSPHRASE"} --import "$KEY_FILE"
          rm -f "$KEY_FILE"
          KEY_ID="${LINUX_GPG_KEY_ID:-$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')}"
          echo "credential preflight" > "${RUNNER_TEMP}/gpg-probe.txt"
          if ! gpg --batch --yes -u "$KEY_ID" ${LINUX_GPG_PASSPHRASE:+--passphrase "$LINUX_GPG_PASSPHRASE"} \
               --detach-sign --output "${RUNNER_TEMP}/gpg-probe.sig" "${RUNNER_TEMP}/gpg-probe.txt"; then
            echo "::error::GPG key ${KEY_ID} imported but cannot sign — wrong LINUX_GPG_PASSPHRASE, or LINUX_GPG_KEY_ID names a key that is not in LINUX_GPG_PRIVATE_KEY"
            exit 1
          fi
          EXPIRES="$(gpg --list-secret-keys --with-colons "$KEY_ID" | awk -F: '/^sec:/ { print $7; exit }')"
          echo "::notice::Linux GPG key OK: ${KEY_ID} signs${EXPIRES:+ (expires $(date -u -d "@${EXPIRES}" +%F))}"

      # Azure Artifact Signing: a client-credentials token request proves the
      # service principal's id/secret/tenant. It cannot prove the signing role
      # on the account — the first signed build does that.
      - name: Azure Artifact Signing credentials
        if: ${{ !cancelled() }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ENDPOINT: ${{ inputs.windows_azure_endpoint }}
          AZURE_ACCOUNT: ${{ inputs.windows_azure_account }}
          AZURE_CERT_PROFILE: ${{ inputs.windows_azure_cert_profile }}
        run: |
          set -euo pipefail
          CREDS="${AZURE_CLIENT_ID:+1}${AZURE_CLIENT_SECRET:+1}${AZURE_TENANT_ID:+1}"
          INPUTS="${AZURE_ENDPOINT:+1}${AZURE_ACCOUNT:+1}${AZURE_CERT_PROFILE:+1}"
          if [ -z "${CREDS}${INPUTS}" ]; then
            echo "::notice::Azure Artifact Signing not configured; nothing to check."
            exit 0
          fi
          if [ "$CREDS" != 111 ] || [ "$INPUTS" != 111 ]; then
            echo "::error::Azure Artifact Signing is half-configured: release.yml needs all three AZURE_* secrets AND all three windows_azure_* inputs (pass the inputs to this workflow too)"
            exit 1
          fi
          CODE="$(printf '%s' "$AZURE_CLIENT_SECRET" | curl -sS -o "${RUNNER_TEMP}/azure.json" -w '%{http_code}' \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "client_id=${AZURE_CLIENT_ID}" \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode 'scope=https://management.azure.com/.default' \
            --data-urlencode 'client_secret@-')"
          if [ "$CODE" != 200 ]; then
            echo "::error::Azure rejected the AZURE_* service principal (HTTP ${CODE}): $(jq -r '.error_description // .error // "no detail"' "${RUNNER_TEMP}/azure.json" | head -1)"
            exit 1
          fi
          echo "::notice::Azure service principal authenticates. Its Artifact Signing Certificate Profile Signer role on ${AZURE_ACCOUNT} is not checked here."

      # GitHub App (app_client_id): release.yml mints a token scoped to each
      # cross-repo target, so minting one here for each target IS the check —
      # the mint fails unless the App is installed there with Contents: write.
      # (An installation token's repo response has no `permissions.push`.)
      - name: GitHub App configuration
        id: app
        if: ${{ !cancelled() }}
        env:
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          RELEASES_REPO: ${{ inputs.releases_repo }}
          TAP_REPO: ${{ inputs.homebrew_tap }}
          SCOOP_BUCKET: ${{ inputs.scoop_bucket }}
        run: |
          set -euo pipefail
          if [ -z "$APP_CLIENT_ID" ]; then
            echo "::notice::No app_client_id — the PATs are checked below."
            exit 0
          fi
          if [ -z "${APP_PRIVATE_KEY:-}" ]; then
            echo "::error::app_client_id is set but the APP_PRIVATE_KEY secret is not"
            exit 1
          fi
          {
            echo "releases_owner=${RELEASES_REPO%%/*}"
            echo "releases_name=${RELEASES_REPO##*/}"
            echo "tap_owner=${TAP_REPO%%/*}"
            echo "tap_name=${TAP_REPO##*/}"
            echo "bucket_owner=${SCOOP_BUCKET%%/*}"
            echo "bucket_name=${SCOOP_BUCKET##*/}"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub App can write the releases repo
        if: ${{ !cancelled() && inputs.app_client_id != '' && inputs.releases_repo != '' && steps.app.outcome == 'success' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.app.outputs.releases_owner }}
          repositories: ${{ steps.app.outputs.releases_name }}
          permission-contents: write

      - name: GitHub App can write the Homebrew tap
        if: ${{ !cancelled() && inputs.app_client_id != '' && inputs.homebrew_tap != '' && steps.app.outcome == 'success' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.app.outputs.tap_owner }}
          repositories: ${{ steps.app.outputs.tap_name }}
          permission-contents: write

      - name: GitHub App can write the Scoop bucket
        if: ${{ !cancelled() && inputs.app_client_id != '' && inputs.scoop_bucket != '' && steps.app.outcome == 'success' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.app.outputs.bucket_owner }}
          repositories: ${{ steps.app.outputs.bucket_name }}
          permission-contents: write

      # A fine-grained PAT's `permissions.push` on the repo it must write.
      - name: RELEASES_TOKEN
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: ${{ inputs.releases_repo }}
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
        run: |
          set -euo pipefail
          if [ -z "$REPO" ]; then
            echo "::notice::No releases_repo — releases are written with GITHUB_TOKEN; nothing to check."
            exit 0
          fi
          if [ -n "$APP_CLIENT_ID" ]; then
            echo "::notice::app_client_id is set — release.yml writes ${REPO} with the GitHub App, not RELEASES_TOKEN."
            exit 0
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::releases_repo is ${REPO} but RELEASES_TOKEN is not set — release.yml fails its preflight without it"
            exit 1
          fi
          if ! PUSH="$(GH_TOKEN="$TOKEN" gh api "repos/${REPO}" --jq '.permissions.push' 2>"${RUNNER_TEMP}/gh.err")"; then
            echo "::error::RELEASES_TOKEN cannot read ${REPO}: $(head -1 "${RUNNER_TEMP}/gh.err") — expired, revoked, or not granted this repository"
            exit 1
          fi
          [ "$PUSH" = true ] || { echo "::error::RELEASES_TOKEN can read ${REPO} but cannot push (needs Contents: Read and write)"; exit 1; }
          echo "::notice::RELEASES_TOKEN can push to ${REPO}."

      - name: HOMEBREW_TAP_TOKEN
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPO: ${{ inputs.homebrew_tap }}
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
        run: |
          set -euo pipefail
          if [ -z "$REPO" ]; then
            echo "::notice::No homebrew_tap; nothing to check."
            exit 0
          fi
          if [ -n "$APP_CLIENT_ID" ]; then
            echo "::notice::app_client_id is set — release.yml pushes the cask with the GitHub App, not HOMEBREW_TAP_TOKEN."
            exit 0
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "::notice::homebrew_tap is ${REPO} but HOMEBREW_TAP_TOKEN is not set — release.yml will skip the cask with a warning."
            exit 0
          fi
          if ! PUSH="$(GH_TOKEN="$TOKEN" gh api "repos/${REPO}" --jq '.permissions.push' 2>"${RUNNER_TEMP}/gh.err")"; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot read ${REPO}: $(head -1 "${RUNNER_TEMP}/gh.err") — expired, revoked, or not granted this repository"
            exit 1
          fi
          [ "$PUSH" = true ] || { echo "::error::HOMEBREW_TAP_TOKEN can read ${REPO} but cannot push (needs Contents: Read and write)"; exit 1; }
          echo "::notice::HOMEBREW_TAP_TOKEN can push to ${REPO}."

      # winget-releaser pushes a branch to <fork user>/winget-pkgs with it.
      - name: WINGET_TOKEN
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
          IDENTIFIER: ${{ inputs.winget_identifier }}
          FORK_USER: ${{ inputs.winget_fork_user || github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "$IDENTIFIER" ]; then
            echo "::notice::No winget_identifier; nothing to check."
            exit 0
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "::notice::winget_identifier is ${IDENTIFIER} but WINGET_TOKEN is not set — release.yml will skip winget with a warning."
            exit 0
          fi
          if ! PUSH="$(GH_TOKEN="$TOKEN" gh api "repos/${FORK_USER}/winget-pkgs" --jq '.permissions.push' 2>"${RUNNER_TEMP}/gh.err")"; then
            echo "::error::WINGET_TOKEN cannot read ${FORK_USER}/winget-pkgs: $(head -1 "${RUNNER_TEMP}/gh.err") — fork microsoft/winget-pkgs to that account, or set winget_fork_user"
            exit 1
          fi
          [ "$PUSH" = true ] || { echo "::error::WINGET_TOKEN cannot push to ${FORK_USER}/winget-pkgs"; exit 1; }
          # winget-releaser refuses a package that is not in winget-pkgs yet.
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -I "https://github.com/microsoft/winget-pkgs/tree/master/manifests/$(printf '%s' "${IDENTIFIER:0:1}" | tr '[:upper:]' '[:lower:]')/${IDENTIFIER//.//}")"
          if [ "$CODE" != 200 ]; then
            echo "::warning::${IDENTIFIER} is not in microsoft/winget-pkgs yet (HTTP ${CODE}) — submit the first version by hand (README, \"winget and Scoop\"); until then release.yml's winget step fails."
          fi
          echo "::notice::WINGET_TOKEN can push to ${FORK_USER}/winget-pkgs."

      - name: SCOOP_TAP_TOKEN
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.SCOOP_TAP_TOKEN }}
          REPO: ${{ inputs.scoop_bucket }}
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
        run: |
          set -euo pipefail
          if [ -z "$REPO" ]; then
            echo "::notice::No scoop_bucket; nothing to check."
            exit 0
          fi
          if [ -n "$APP_CLIENT_ID" ]; then
            echo "::notice::app_client_id is set — release.yml pushes the Scoop manifest with the GitHub App, not SCOOP_TAP_TOKEN."
            exit 0
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "::notice::scoop_bucket is ${REPO} but SCOOP_TAP_TOKEN is not set — release.yml will skip Scoop with a warning."
            exit 0
          fi
          if ! PUSH="$(GH_TOKEN="$TOKEN" gh api "repos/${REPO}" --jq '.permissions.push' 2>"${RUNNER_TEMP}/gh.err")"; then
            echo "::error::SCOOP_TAP_TOKEN cannot read ${REPO}: $(head -1 "${RUNNER_TEMP}/gh.err")"
            exit 1
          fi
          [ "$PUSH" = true ] || { echo "::error::SCOOP_TAP_TOKEN can read ${REPO} but cannot push (needs Contents: Read and write)"; exit 1; }
          echo "::notice::SCOOP_TAP_TOKEN can push to ${REPO}."

  # Imports the Developer ID certificate into a throwaway keychain, requires
  # APPLE_SIGNING_IDENTITY among its valid code-signing identities, and makes
  # one authenticated notarytool call with whichever notarization credentials
  # release.yml would use (API key first, then Apple ID).
  apple:
    needs: credentials
    if: needs.credentials.outputs.apple == 'true'
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions: {}
    steps:
      - name: Developer ID certificate
        if: ${{ !cancelled() }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              echo "::notice::APPLE_SIGNING_IDENTITY without APPLE_CERTIFICATE is the self-hosted keychain mode; the identity lives on that machine, so it is not checked here."
            else
              echo "::notice::No APPLE_CERTIFICATE — macOS builds ship unsigned."
            fi
            exit 0
          fi
          for required in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::APPLE_CERTIFICATE is set but ${required} is empty — release.yml fails half-configured Apple signing"
              exit 1
            fi
          done
          KEYCHAIN="${RUNNER_TEMP}/preflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12="${RUNNER_TEMP}/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null; then
            rm -f "$P12"; security delete-keychain "$KEYCHAIN"
            echo "::error::APPLE_CERTIFICATE did not import — wrong APPLE_CERTIFICATE_PASSWORD, or not a base64 .p12"
            exit 1
          fi
          rm -f "$P12"
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          security delete-keychain "$KEYCHAIN"
          echo "$IDENTITIES"
          if ! printf '%s\n' "$IDENTITIES" | grep -qF "\"${APPLE_SIGNING_IDENTITY}\""; then
            echo "::error::APPLE_SIGNING_IDENTITY is not a VALID code-signing identity in APPLE_CERTIFICATE (expired or revoked certificates are not listed; see the identities above)"
            exit 1
          fi
          echo "::notice::Apple certificate OK: \"${APPLE_SIGNING_IDENTITY}\" is valid for code signing."

      - name: Notarization credentials
        if: ${{ !cancelled() }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          API="${APPLE_API_ISSUER:+1}${APPLE_API_KEY:+1}${APPLE_API_KEY_BASE64:+1}"
          AID="${APPLE_ID:+1}${APPLE_PASSWORD:+1}${APPLE_TEAM_ID:+1}"
          if [ -n "$API" ]; then
            [ "$API" = 111 ] || { echo "::error::App Store Connect API key is half-configured: set APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_BASE64 together"; exit 1; }
            KEY="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY"
            set +e
            xcrun notarytool history --key "$KEY" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --output-format json > /dev/null 2> "${RUNNER_TEMP}/notary.err"
            CODE=$?
            set -e
            rm -f "$KEY"
            METHOD="App Store Connect API key ${APPLE_API_KEY}"
          elif [ -n "$AID" ]; then
            [ "$AID" = 111 ] || { echo "::error::Apple ID notarization is half-configured: set APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID together"; exit 1; }
            set +e
            xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json > /dev/null 2> "${RUNNER_TEMP}/notary.err"
            CODE=$?
            set -e
            METHOD="Apple ID ${APPLE_ID}"
          else
            echo "::notice::No notarization credentials — signed macOS builds will not be notarized."
            exit 0
          fi
          if [ "$CODE" != 0 ]; then
            cat "${RUNNER_TEMP}/notary.err"
            echo "::error::notarytool could not authenticate with the ${METHOD} (see above)"
            exit 1
          fi
          echo "::notice::Notarization credentials OK (${METHOD})."

  # Decodes and imports the PFX the way release.yml does, and requires a
  # certificate WITH its private key, the pinned thumbprint if one is set, and
  # an expiry that has not passed (a warning inside 30 days).
  windows:
    needs: credentials
    if: needs.credentials.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions: {}
    steps:
      - name: Code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Output "::error::WINDOWS_CERTIFICATE is set but WINDOWS_CERTIFICATE_PASSWORD is not — release.yml fails half-configured PFX signing"
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'preflight.pfx'
          $raw = ($env:WINDOWS_CERTIFICATE -replace '-{5}[^-]+-{5}', '') -replace '\s', ''
          try {
            [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($raw))
          } catch {
            Write-Output "::error::WINDOWS_CERTIFICATE is not valid base64"
            exit 1
          }
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          try {
            $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          } catch {
            Write-Output "::error::The .pfx did not import — wrong WINDOWS_CERTIFICATE_PASSWORD, or not a PKCS#12 bundle ($($_.Exception.Message))"
            exit 1
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          $imported | ForEach-Object { Remove-Item "Cert:\CurrentUser\My\$($_.Thumbprint)" -ErrorAction SilentlyContinue }
          if (-not $cert) {
            Write-Output "::error::WINDOWS_CERTIFICATE imported, but no certificate in it carries a private key — it cannot sign"
            exit 1
          }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT -and $env:WINDOWS_CERTIFICATE_THUMBPRINT -ne $cert.Thumbprint) {
            Write-Output "::error::The .pfx holds $($cert.Thumbprint), not the pinned WINDOWS_CERTIFICATE_THUMBPRINT — release.yml refuses to sign with it"
            exit 1
          }
          $left = ($cert.NotAfter - (Get-Date)).Days
          if ($left -lt 0) {
            Write-Output "::error::$($cert.Subject) expired on $($cert.NotAfter.ToString('yyyy-MM-dd'))"
            exit 1
          }
          if ($left -lt 30) {
            Write-Output "::warning::$($cert.Subject) expires in $left days ($($cert.NotAfter.ToString('yyyy-MM-dd'))) — renew it and update WINDOWS_CERTIFICATE"
          }
          Write-Output "::notice::Windows certificate OK: $($cert.Subject), thumbprint $($cert.Thumbprint), valid until $($cert.NotAfter.ToString('yyyy-MM-dd'))."
