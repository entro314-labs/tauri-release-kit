# Reusable Rust quality gates for Tauri apps: fmt + clippy (+ optional tests)
# across the three desktop OSes. Run this on branch pushes/PRs so release tags
# never discover gate failures — the exact failure mode that burned six
# release-workflow runs on anasa's first release (a Mac cannot see Linux-host
# or Linux-target diagnostics: unused imports in cfg-gated code, dead_code on
# platform-only items, doc lints in cfg(linux) modules).

name: Rust checks (reusable)

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Path to the Tauri app package (contains src-tauri/)'
        required: false
        type: string
        default: '.'
      run_tests:
        description: 'Also run cargo test on each OS'
        required: false
        type: boolean
        default: false
      node_version:
        required: false
        type: string
        default: '24'

jobs:
  rust-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.project_path }}/src-tauri
          shared-key: checks-${{ matrix.os }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libjavascriptcoregtk-4.1-dev
            libsoup-3.0-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
          version: 1.0

      # tauri-build's codegen needs the frontend deps present (beforeBuildCommand
      # is not run for check/clippy, but the tauri config is still parsed).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        working-directory: ${{ inputs.project_path }}/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy check
        working-directory: ${{ inputs.project_path }}/src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        if: inputs.run_tests
        working-directory: ${{ inputs.project_path }}/src-tauri
        run: cargo test
