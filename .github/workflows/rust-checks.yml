# Reusable Rust quality gates for Tauri apps: fmt + clippy (+ optional tests)
# across the three desktop OSes. Run this on branch pushes/PRs so release tags
# never discover gate failures — the exact failure mode that burned six
# release-workflow runs on the first release this kit was extracted from (a
# Mac cannot see Linux-host
# or Linux-target diagnostics: unused imports in cfg-gated code, dead_code on
# platform-only items, doc lints in cfg(linux) modules).

name: Rust checks (reusable)

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Path to the Tauri app package (contains src-tauri/)'
        required: false
        type: string
        default: '.'
      run_tests:
        description: 'Also run cargo test on each OS'
        required: false
        type: boolean
        default: false
      rust_workspace_dir:
        description: >-
          Directory containing the cargo workspace root (Cargo.lock + target/).
          Defaults to '<project_path>/src-tauri' (src-tauri is its own
          workspace). Set to '.' for repo-root workspaces where src-tauri is a
          member.
        required: false
        type: string
        default: ''
      clippy_args:
        description: >-
          Extra args for `cargo clippy` (before `-- -D warnings`), e.g.
          '--workspace --all-targets --all-features' for multi-crate workspaces
          with a stricter gate.
        required: false
        type: string
        default: ''
      test_args:
        description: "Extra args for `cargo test`, e.g. '--workspace'."
        required: false
        type: string
        default: ''
      node_version:
        required: false
        type: string
        default: '24'
      macos_runner:
        description: >-
          Runner for the macOS leg. Default: the GitHub-hosted macos-15 image,
          which bills 10× on private repos — on EVERY push, since this
          workflow is the per-push gate. Set a SINGLE self-hosted runner
          label (e.g. 'macbook') to run it on your own mac for free. NEVER do
          this on a public repo: this workflow runs on pull_request, and a
          self-hosted runner there executes fork-PR code on your machine.
        required: false
        type: string
        default: 'macos-15'

jobs:
  rust-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, '${{ inputs.macos_runner }}', windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.rust_workspace_dir != '' && inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}
          shared-key: checks-${{ matrix.os }}
          cache-on-failure: true

      # Plain apt-get, NOT a caching action — the rule GOTCHAS.md records after
      # the cache action reported packages installed while installing none.
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-build's codegen needs the frontend deps present (beforeBuildCommand
      # is not run for check/clippy, but the tauri config is still parsed).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        working-directory: ${{ inputs.project_path }}/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy check
        working-directory: ${{ inputs.project_path }}/src-tauri
        shell: bash
        env:
          CLIPPY_ARGS: ${{ inputs.clippy_args }}
        run: |
          # shellcheck disable=SC2086 # CLIPPY_ARGS is a caller-supplied flag list; splitting it is the point
          cargo clippy ${CLIPPY_ARGS:-} -- -D warnings

      - name: Rust tests
        if: inputs.run_tests
        working-directory: ${{ inputs.project_path }}/src-tauri
        shell: bash
        env:
          TEST_ARGS: ${{ inputs.test_args }}
        run: |
          # shellcheck disable=SC2086 # TEST_ARGS is a caller-supplied flag list; splitting it is the point
          cargo test ${TEST_ARGS:-}
