# Reusable Rust quality gates for Tauri apps: fmt + clippy (+ optional tests)
# across the three desktop OSes, plus a blocking `cargo audit` of Cargo.lock
# against the RustSec advisory database. Run this on branch pushes/PRs so release tags
# never discover gate failures — the exact failure mode that burned six
# release-workflow runs on the first release this kit was extracted from (a
# Mac cannot see Linux-host
# or Linux-target diagnostics: unused imports in cfg-gated code, dead_code on
# platform-only items, doc lints in cfg(linux) modules).

name: Rust checks (reusable)

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Path to the Tauri app package (contains src-tauri/)'
        required: false
        type: string
        default: '.'
      run_tests:
        description: 'Also run cargo test on each OS'
        required: false
        type: boolean
        default: false
      rust_workspace_dir:
        description: >-
          Directory containing the cargo workspace root (Cargo.lock + target/).
          Defaults to '<project_path>/src-tauri' (src-tauri is its own
          workspace). Set to '.' for repo-root workspaces where src-tauri is a
          member.
        required: false
        type: string
        default: ''
      clippy_args:
        description: >-
          Extra args for `cargo clippy` (before `-- -D warnings`), e.g.
          '--workspace --all-targets --all-features' for multi-crate workspaces
          with a stricter gate.
        required: false
        type: string
        default: ''
      test_args:
        description: "Extra args for `cargo test`, e.g. '--workspace'."
        required: false
        type: string
        default: ''
      node_version:
        required: false
        type: string
        default: '24'
      cargo_audit:
        description: >-
          Run `cargo audit` against the workspace's Cargo.lock and FAIL on any
          RustSec vulnerability advisory (unmaintained/unsound warnings do not
          fail it). Runs once, on ubuntu — the lockfile is the same on every OS.
        required: false
        type: boolean
        default: true
      audit_ignore:
        description: >-
          Comma-separated RustSec advisory IDs to ignore, e.g.
          'RUSTSEC-2024-0370,RUSTSEC-2025-0012'. Each one is an accepted risk:
          record why next to the caller's input. A `.cargo/audit.toml` in the
          workspace is honoured too.
        required: false
        type: string
        default: ''
      macos_runner:
        description: >-
          Runner for the macOS leg. Default: the GitHub-hosted macos-15 image,
          which bills 10× on private repos — on EVERY push, since this
          workflow is the per-push gate. Set a SINGLE self-hosted runner
          label (e.g. 'macbook') to run it on your own mac for free. NEVER do
          this on a public repo: this workflow runs on pull_request, and a
          self-hosted runner there executes fork-PR code on your machine.
        required: false
        type: string
        default: 'macos-15'

# Each job declares what it needs; in a workflow_call the caller's grant is the ceiling.
permissions:
  contents: read

jobs:
  rust-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, '${{ inputs.macos_runner }}', windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.rust_workspace_dir != '' && inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}
          shared-key: checks-${{ matrix.os }}
          cache-on-failure: true
          # Only default-branch runs write the cache. Pull request and feature-branch
          # runs still restore the default branch's entry, but no longer save
          # per-ref entries nothing else can use, which evicted the useful ones
          # from the repository's 10 GB cache quota.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Plain apt-get, NOT a caching action — the rule GOTCHAS.md records after
      # the cache action reported packages installed while installing none.
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-build's codegen needs the frontend deps present (beforeBuildCommand
      # is not run for check/clippy, but the tauri config is still parsed).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        working-directory: ${{ inputs.project_path }}/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy check
        working-directory: ${{ inputs.project_path }}/src-tauri
        shell: bash
        env:
          CLIPPY_ARGS: ${{ inputs.clippy_args }}
        run: |
          # shellcheck disable=SC2086 # CLIPPY_ARGS is a caller-supplied flag list; splitting it is the point
          cargo clippy ${CLIPPY_ARGS:-} -- -D warnings

      - name: Rust tests
        if: inputs.run_tests
        working-directory: ${{ inputs.project_path }}/src-tauri
        shell: bash
        env:
          TEST_ARGS: ${{ inputs.test_args }}
        run: |
          # shellcheck disable=SC2086 # TEST_ARGS is a caller-supplied flag list; splitting it is the point
          cargo test ${TEST_ARGS:-}

  # A vulnerable dependency is invisible to fmt/clippy/tests and ships in
  # every build; the advisory database moves daily, so this is also what
  # surfaces a new CVE in an unchanged lockfile. Not part of the OS matrix:
  # Cargo.lock is identical on all three.
  cargo-audit:
    if: inputs.cargo_audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prebuilt, checksum-verified binary from the manifest committed at the
      # pinned SHA (so the cargo-audit version moves only with a Dependabot
      # bump of this action). fallback: none — never build an unpinned
      # version from crates.io if the manifest cannot serve this runner.
      - name: Install cargo-audit
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit
          fallback: none

      - name: cargo audit
        working-directory: ${{ inputs.rust_workspace_dir != '' && inputs.rust_workspace_dir || format('{0}/src-tauri', inputs.project_path) }}
        env:
          AUDIT_IGNORE: ${{ inputs.audit_ignore }}
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then
            echo "::error::No Cargo.lock in ${PWD} — set rust_workspace_dir to the directory that holds the workspace lockfile"
            exit 1
          fi
          ARGS=()
          for id in $(printf '%s' "$AUDIT_IGNORE" | tr ',' ' '); do
            # A typo here would silently ignore nothing, so reject it outright.
            if ! printf '%s' "$id" | grep -Eq '^RUSTSEC-[0-9]{4}-[0-9]{4}$'; then
              echo "::error::audit_ignore entry '${id}' is not a RustSec ID (RUSTSEC-YYYY-NNNN)"
              exit 1
            fi
            ARGS+=(--ignore "$id")
            echo "::notice::Ignoring ${id} (audit_ignore input)"
          done
          # The binary directly, not `cargo audit`: going through the cargo proxy
          # would make rustup install the repo's pinned toolchain first, and
          # auditing an existing Cargo.lock needs no toolchain at all.
          cargo-audit audit "${ARGS[@]}"
