# Lints this repository's own workflows. The kit's workflows are what consumers run with
# their secrets, so a shell bug or an injectable expression here ships to every app.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Type-checks expressions and runs shellcheck over every `run:` block.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      # Security audit. Accepted findings live in .github/zizmor.yml, each with its reason.
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false

  # The release checks the reusable workflows import from scripts/ (checked out at the
  # caller's pinned kit commit). A broken check here would pass or fail every consumer's
  # release for the wrong reason.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 is what actions/github-script v9 runs these modules on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: node --test
        run: node --test 'scripts/*.test.mjs'

      # actionlint only sees `run:` blocks; the scripts the workflows call are checked here.
      - name: shellcheck
        run: shellcheck scripts/*.sh

      # The Windows smoke test cannot run on Linux; at least prove it parses.
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Output "::error file=$($file.Name)::$_" }; $failed = $true }
          }
          if ($failed) { exit 1 }
